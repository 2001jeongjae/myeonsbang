<style>
:root {
  /* 면스방 디자인
     - 모양: 사용자가 보여 준 포트폴리오 예시처럼 단순하게. 큰 제목 + 포인트 색 한 단어 + 버튼 하나, 오른쪽에 둥근 색 덩어리.
     - 색: 흰 바탕, 짙은 남색 글자, 파랑 한 가지 (사용자가 예시처럼 파랑을 고름)
     - 규칙: taste (모양 한 벌, 기울임 없음, 44px 터치, 본문 대비 7:1)와
       Vercel Web Interface Guidelines (보이는 포커스, transform·opacity만 움직임, 줄인 움직임 존중, 터치 지연 없앰) */
  --canvas: #ffffff;
  --soft: #f6f7f9;
  --strong: #eceef2;
  --ink: #18212f;
  --body: #3a4354;
  --muted: #667085;
  --line: #e4e7ec;
  --line-soft: #eef0f3;
  --field: #c3c8d0;
  --brand: #4070f4;          /* 큰 색 덩어리·로고처럼 글자 없는 곳 */
  --accent: #2f5fe3;         /* 버튼 바탕·강조 글자 (흰 글자 대비 5.4:1) */
  --accent-hover: #2a55cc;
  --accent-press: #2449b0;
  --accent-soft: #eef3ff;
  --accent-text: #2449b0;    /* 연한 포인트 바탕 위 글자 (7.1:1) */
  --accent-disabled: #c7d5fb;
  --on-accent: #ffffff;
  --font: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, sans-serif;
  /* 조건·상태 색 */
  --same: #0b6b60; --same-bg: #e3f3f0;
  --diverse: #8f4405; --diverse-bg: #fcefdf;
  --any: #4a5263; --any-bg: #eef0f3;
  --ok: #146c43; --ok-bg: #e4f4ea;
  --wait: #6f4b00; --wait-bg: #fdf1d6;
  --bad: #c13515; --bad-bg: #fdeceb;
  --shadow: 0 16px 36px -14px rgba(16, 24, 40, .22), 0 2px 6px rgba(16, 24, 40, .06);
  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 24px;
  --r-full: 9999px;
  --top-h: 68px;
  --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
.narrow-only { display: none; }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; scroll-padding-top: calc(var(--top-h) + 16px); }
@media (pointer: fine) { html { overscroll-behavior: none; } }
html:has(body.has-bar) { scroll-padding-bottom: 104px; }
body {
  margin: 0; background: var(--canvas); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.55; letter-spacing: -.01em;
  word-break: keep-all; overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
a { color: var(--ink); }
a, button, input, select, textarea, summary, label { touch-action: manipulation; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
select { background-color: var(--canvas); color: var(--ink); }
h1, h2, h3 { text-wrap: balance; letter-spacing: -.03em; }
p { text-wrap: pretty; }
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 8px; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
.wrap.narrow { max-width: 760px; }
main { min-height: 60vh; padding-bottom: 56px; }
body.has-bar main { padding-bottom: 120px; }
body.sheet-open { overflow: hidden; }

/* 키보드로 처음 Tab을 누르면 보이는 건너뛰기 */
.skip { position: fixed; left: 12px; top: 12px; z-index: 70; min-height: 44px; padding: 0 16px; border-radius: var(--r-sm); border: 0; background: var(--ink); color: #fff; font-weight: 500; cursor: pointer; transform: translateY(-160%); }
.skip:focus-visible { transform: none; outline-color: var(--brand); }

/* 밑줄이 그려지는 링크 (한 가지 모양, transform만 움직임) */
.link, .foot a, .back, .muted a { --ul: 0px; position: relative; display: inline-block; color: var(--ink); text-decoration: none; cursor: pointer; }
.link::before, .foot a::before, .back::before, .muted a::before,
.link::after, .foot a::after, .back::after, .muted a::after { content: ""; position: absolute; left: 0; right: 0; bottom: var(--ul); height: 1px; background: var(--field); }
.link::after, .foot a::after, .back::after, .muted a::after { height: 1.5px; background: currentColor; transform: scaleX(0); transform-origin: left center; transition: transform .3s var(--ease); }
.link:hover::after, .foot a:hover::after, .back:hover::after, .muted a:hover::after { transform: scaleX(1); }
.link { border: 0; padding: 0 0 2px; font-size: inherit; font-weight: 600; background: none; }
.link.danger { color: var(--bad); }

/* 체험 모드 띠 */
.demo { background: var(--soft); border-bottom: 1px solid var(--line-soft); font-size: 14px; }
.demo-in { max-width: 1080px; margin: 0 auto; padding: 6px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
.demo-tag { font-weight: 600; background: var(--ink); color: #fff; padding: 1px 10px; border-radius: var(--r-full); }
.demo-text { flex: 1 1 240px; color: var(--body); }
.demo-pick { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
.demo-pick select { min-height: 44px; padding: 0 10px; border-radius: var(--r-sm); border: 1px solid var(--field); max-width: 210px; }
.demo .link { --ul: 11px; padding: 12px 0; }

/* 머리: 한 줄 */
.top { position: sticky; top: 0; z-index: 20; background: rgba(255, 255, 255, .92); -webkit-backdrop-filter: saturate(1.4) blur(12px); backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line-soft); }
.top-in { max-width: 1080px; height: var(--top-h); margin: 0 auto; padding: 0 24px; display: flex; align-items: center; gap: 6px; }
.logo { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; margin-right: auto; color: var(--ink); text-decoration: none; }
.logo-mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: var(--brand); color: #fff; font-size: 15px; font-weight: 700; line-height: 1; }
.logo-text { font-size: 19px; font-weight: 700; letter-spacing: -.04em; white-space: nowrap; }
.nav { display: flex; align-items: center; gap: 2px; }
.nav a { position: relative; display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; color: var(--body); font-size: 15px; font-weight: 500; text-decoration: none; white-space: nowrap; }
.nav a::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 6px; height: 2px; border-radius: 2px; background: var(--accent); transform: scaleX(0); transform-origin: left center; transition: transform .25s var(--ease); }
.nav a:hover { color: var(--ink); }
.nav a:hover::after { transform: scaleX(.4); }
.nav a[aria-current="page"] { color: var(--ink); font-weight: 600; }
.nav a[aria-current="page"]::after { transform: scaleX(1); }
.top .btn-new { min-height: 44px; margin-left: 10px; padding: 0 18px; font-size: 15px; }
@media (max-width: 767px) {
  .nav .nav-wide, .wide-only { display: none; }
  .narrow-only { display: inline; }
  .top-in { padding: 0 16px; gap: 2px; }
  .nav a { padding: 0 10px; }
  .nav a::after { left: 10px; right: 10px; }
  .top .btn-new { margin-left: 6px; padding: 0 14px; }
}
@media (max-width: 359px) { .logo-text { display: none; } }

/* 버튼: 채운 것(주요) 하나, 테두리만 있는 것 하나 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 48px; padding: 0 22px; border-radius: var(--r-sm);
  border: 1px solid var(--field); background: var(--canvas); color: var(--ink);
  font-weight: 600; font-size: 16px; line-height: 1.25; text-decoration: none; white-space: nowrap; cursor: pointer;
  transition: transform .12s var(--ease);
}
.btn:hover { border-color: var(--ink); background: var(--soft); }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-primary:active { background: var(--accent-press); border-color: var(--accent-press); }
.btn[disabled] { background: var(--strong); border-color: var(--strong); color: #8a93a3; cursor: not-allowed; transform: none; }
.btn-primary[disabled] { background: var(--accent-disabled); border-color: var(--accent-disabled); color: #fff; }
.btn-danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn-danger:hover { background: #a32c11; border-color: #a32c11; }
.danger-outline { color: var(--bad); border-color: var(--bad); }
.danger-outline:hover { background: var(--bad-bg); border-color: var(--bad); }
.btn-small { min-height: 44px; padding: 0 16px; font-size: 15px; }
.btn-lg { min-height: 54px; padding: 0 28px; font-size: 17px; }
.btn-wide { width: 100%; min-height: 56px; font-size: 17px; }

/* 첫 화면: 왼쪽 큰 제목, 오른쪽 색 덩어리 위 카드 두 장 */
.hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); align-items: center; gap: 48px; padding: 64px 0 72px; min-height: min(600px, calc(100svh - var(--top-h))); }
.hero h1 { margin: 0; font-size: clamp(36px, 5.4vw, 58px); line-height: 1.2; font-weight: 700; letter-spacing: -.04em; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero-sub { margin: 20px 0 0; max-width: 28em; font-size: 18px; color: var(--body); }
.hero-act { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
.hero-art { position: relative; height: 420px; }
.blob { position: absolute; top: 16px; bottom: 16px; left: 4%; right: 0; background: var(--brand); border-radius: 58% 42% 49% 51% / 47% 56% 44% 53%; }
.mini { position: absolute; display: flex; align-items: center; gap: 14px; width: min(330px, 86%); padding: 16px 18px 16px 16px; border-radius: 18px; background: var(--canvas); box-shadow: var(--shadow); }
.mini.m1 { top: 64px; left: 4%; }
.mini.m2 { bottom: 56px; right: 0; }
body:not(.entered) .hero[data-enter] .hero-copy { animation: rise .6s var(--ease) both; }
body:not(.entered) .hero[data-enter] .mini.m1 { animation: rise .6s .12s var(--ease) both; }
body:not(.entered) .hero[data-enter] .mini.m2 { animation: rise .6s .22s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@media (max-width: 899px) {
  .hero { grid-template-columns: 1fr; min-height: 0; padding: 44px 0 40px; gap: 0; }
  .hero-art { display: none; }
  .hero-sub { font-size: 17px; }
  .hero-act .btn { flex: 1 1 140px; }
}

/* 모집 글 목록 */
.board { padding-top: 8px; }
.board-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 18px; }
.board-head h2 { margin: 0; font-size: 26px; font-weight: 700; scroll-margin-top: calc(var(--top-h) + 16px); }
.count { margin: 0; color: var(--muted); font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 20px; }
.search { position: relative; flex: 1 1 300px; max-width: 420px; }
.search svg { position: absolute; left: 16px; top: 50%; margin-top: -9px; color: var(--muted); pointer-events: none; }
.search input { width: 100%; height: 48px; padding: 0 16px 0 44px; border: 1px solid var(--field); border-radius: var(--r-full); background: var(--canvas); font-size: 16px; -webkit-appearance: none; appearance: none; }
.search input::placeholder { color: var(--muted); }
.search input:hover { border-color: #8a93a3; }
.search input:focus { outline: none; border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.fchips { display: flex; flex-wrap: wrap; gap: 8px; }
.fchip { min-height: 44px; padding: 0 16px; border-radius: var(--r-full); border: 1px solid var(--line); background: var(--canvas); color: var(--body); font-weight: 500; font-size: 15px; white-space: nowrap; cursor: pointer; transition: transform .12s var(--ease); }
.fchip:hover { border-color: var(--ink); color: var(--ink); }
.fchip:active { transform: scale(.97); }
.fchip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
@media (max-width: 599px) {
  .search { flex-basis: 100%; max-width: none; }
  .fchips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; width: 100%; }
  .fchip { padding: 0 4px; font-size: 14px; }
}

.tickets { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 16px; }
.tickets > li { display: grid; content-visibility: auto; contain-intrinsic-size: auto 190px; }
.ticket { position: relative; display: flex; align-items: flex-start; gap: 16px; padding: 20px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--canvas); color: var(--ink); text-decoration: none; transition: transform .2s var(--ease); }
.ticket::after { content: ""; position: absolute; inset: -1px; border-radius: inherit; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .2s var(--ease); }
.ticket:hover { transform: translateY(-2px); }
.ticket:hover::after { opacity: 1; }
.ticket:active { transform: translateY(0); }
.dbadge { flex: none; display: grid; place-content: center; gap: 3px; width: 64px; height: 64px; border-radius: 14px; background: var(--soft); text-align: center; }
.dbadge b { font-size: 18px; font-weight: 700; line-height: 1; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.dbadge small { font-size: 11.5px; font-weight: 500; color: var(--muted); }
.urgent .dbadge { background: var(--accent-soft); }
.urgent .dbadge b { color: var(--accent-text); }
.tk-body { flex: 1; min-width: 0; display: grid; gap: 6px; }
.tk-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.company { min-width: 0; font-size: 17px; font-weight: 700; letter-spacing: -.03em; }
.tk-title { display: block; color: var(--body); font-weight: 500; }
.tk-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 14px; color: var(--muted); }
.tk-jobs { display: block; font-size: 13.5px; color: var(--muted); }
.tk-foot { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 2px; font-size: 13.5px; color: var(--muted); }
.tk-extra { display: flex; flex-wrap: wrap; gap: 6px; }
.seats { display: inline-flex; gap: 4px; }
.seats i { width: 9px; height: 9px; border-radius: 50%; background: var(--strong); }
.seats i.on { background: var(--brand); }
.num { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); }
.by { margin-left: auto; }
.chip { display: inline-flex; align-items: center; min-height: 24px; padding: 0 9px; border-radius: var(--r-full); font-size: 12.5px; font-weight: 600; background: var(--any-bg); color: var(--any); }
.chip.rule-same { background: var(--same-bg); color: var(--same); }
.chip.rule-diverse { background: var(--diverse-bg); color: var(--diverse); }
.chip.rule-any { background: var(--any-bg); color: var(--any); }
.chip.ex { background: transparent; border: 1px dashed var(--field); color: var(--muted); }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.wait { background: var(--wait-bg); color: var(--wait); }
.chip.no { background: var(--bad-bg); color: var(--bad); }
.pill { flex: none; display: inline-flex; align-items: center; min-height: 24px; padding: 0 10px; border-radius: var(--r-full); font-size: 12.5px; font-weight: 600; }
.pill.st-open { background: var(--ok-bg); color: var(--ok); }
.pill.st-full, .pill.st-closed { background: var(--any-bg); color: var(--any); }
.pill.st-past { background: var(--bad-bg); color: var(--bad); }

/* 모집이 끝난 글 (접어 둠) */
.done { margin-top: 28px; }
.done summary { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding-right: 8px; color: var(--body); font-weight: 600; cursor: pointer; list-style: none; }
.done summary::-webkit-details-marker { display: none; }
.done summary::before { content: ""; width: 8px; height: 8px; margin: 0 4px 0 2px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); transition: transform .2s var(--ease); }
.done[open] summary::before { transform: rotate(45deg); }
.done .tickets { margin-top: 12px; }
.done .ticket { background: var(--soft); border-color: var(--line-soft); }
.done .dbadge { background: var(--canvas); }
.done .dbadge b { color: var(--muted); }

/* 빈 화면 */
.empty { display: grid; justify-items: center; gap: 8px; padding: 44px 20px; border-radius: var(--r-md); background: var(--soft); text-align: center; }
.empty p { margin: 0; color: var(--body); }
.empty .empty-t { color: var(--ink); font-size: 18px; font-weight: 700; }
.empty .btn { margin-top: 10px; }

/* 글 상세 */
.back { --ul: 10px; display: inline-flex; align-items: center; min-height: 44px; margin: 16px 0 8px; font-weight: 500; }
.detail { display: grid; gap: 28px; }
.d-head { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.d-stub { display: grid; place-content: center; gap: 6px; width: 92px; height: 92px; border-radius: 20px; background: var(--soft); text-align: center; }
.d-stub.urgent { background: var(--accent-soft); }
.d-stub .dd { font-size: 26px; font-weight: 700; line-height: 1; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.d-stub.urgent .dd { color: var(--accent-text); }
.dd-date { font-size: 12px; font-weight: 500; color: var(--muted); }
.d-titles { min-width: 0; }
.d-titles .company { display: block; margin: 0; color: var(--muted); font-size: 15px; font-weight: 500; }
.d-titles h1 { margin: 2px 0 10px; font-size: clamp(24px, 5vw, 32px); line-height: 1.25; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 24px; margin: 0; border-top: 1px solid var(--line); }
.facts div { padding: 14px 0; border-bottom: 1px solid var(--line-soft); }
.facts dt { font-size: 13.5px; font-weight: 500; color: var(--muted); }
.facts dd { margin: 2px 0 0; font-weight: 600; }
.rulebox { padding: 16px 18px; border-radius: var(--r-sm); background: var(--any-bg); color: var(--ink); }
.rulebox.rule-same { background: var(--same-bg); }
.rulebox.rule-diverse { background: var(--diverse-bg); }
.rulebox b { display: block; margin-bottom: 2px; font-weight: 700; }
.rulebox.rule-same b { color: var(--same); }
.rulebox.rule-diverse b { color: var(--diverse); }
.d-sec h2 { display: flex; align-items: baseline; gap: 8px; margin: 0 0 12px; font-size: 20px; font-weight: 700; }
.d-sec h3 { display: flex; align-items: baseline; gap: 6px; margin: 4px 0 10px; font-size: 16px; font-weight: 700; }
main > .d-sec { margin-top: 28px; }
.intro { margin: 0; white-space: pre-wrap; color: var(--body); }
.people { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.person { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
.avatar { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--soft); color: var(--ink); font-weight: 700; }
.p-main { flex: 1; min-width: 0; display: grid; }
.p-name { font-weight: 600; }
.p-job { font-size: 14px; color: var(--muted); }
.tag-host { display: inline-flex; align-items: center; min-height: 20px; margin-left: 4px; padding: 0 8px; border-radius: var(--r-full); background: var(--accent-soft); color: var(--accent-text); font-size: 12px; font-weight: 600; vertical-align: 1px; }
.person .link { --ul: 11px; flex: none; min-height: 44px; display: inline-flex; align-items: center; }
.empty-seat .avatar { background: transparent; border: 1.5px dashed var(--field); color: var(--muted); font-weight: 500; }
.empty-seat .p-name { color: var(--muted); font-weight: 500; }
.host-panel { padding: 22px; border-radius: var(--r-md); background: var(--soft); }
.appls { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.appl { display: grid; gap: 8px; padding: 14px 16px; border-radius: var(--r-md); background: var(--canvas); border: 1px solid var(--line); }
.appl-who { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.tag-nick { font-weight: 600; }
.tag-job { font-size: 14px; color: var(--muted); }
.appl-when { margin-left: auto; font-size: 13px; color: var(--muted); }
.appl-intro { margin: 0; font-size: 15px; color: var(--body); }
.appl-act { display: flex; justify-content: flex-end; gap: 8px; }
.warn { margin: 0; font-size: 14px; font-weight: 500; color: var(--bad); }
.host-act { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.muted { margin: 0; color: var(--muted); }
.page-h { margin: 36px 0 8px; font-size: clamp(28px, 5vw, 36px); font-weight: 700; }

/* 아래 고정 버튼 줄 */
.actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(255, 255, 255, .96); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
.bar-in { max-width: 760px; margin: 0 auto; padding: 12px 24px calc(12px + env(safe-area-inset-bottom)); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.bar-left, .bar-right { display: flex; align-items: center; gap: 8px; }
.bar-note { font-size: 15px; font-weight: 600; color: var(--muted); }
.bar-note.ok { color: var(--ok); }
.bar-note.wait { color: var(--wait); }
@media (max-width: 480px) { .bar-in { padding-left: 16px; padding-right: 16px; } }

/* 입력: 칸마다 상자 없이 제목으로만 나눔 */
.form { display: grid; gap: 28px; }
.form.tight { gap: 14px; }
.form h1 { margin: 12px 0 0; font-size: clamp(28px, 5vw, 36px); font-weight: 700; }
.lead { margin: -16px 0 0; color: var(--body); }
.group { display: grid; gap: 22px; min-width: 0; margin: 0; padding: 0; border: 0; }
.group + .group { padding-top: 28px; border-top: 1px solid var(--line-soft); }
.group legend { float: left; width: 100%; padding: 0; margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.03em; color: var(--ink); }
.field { display: grid; gap: 8px; min-width: 0; }
.field.sub { margin-top: 6px; }
.field > label, .label { font-size: 15px; font-weight: 600; }
.opt { font-size: 13.5px; font-weight: 400; color: var(--muted); }
.field input:not([type="checkbox"]):not([type="radio"]), .field select, .field textarea {
  width: 100%; min-height: 52px; padding: 13px 14px; border-radius: var(--r-sm);
  border: 1px solid var(--field); background: var(--canvas); font-size: 16px;
}
.field input:not([type="checkbox"]):not([type="radio"]):hover, .field select:hover, .field textarea:hover { border-color: #8a93a3; }
.field input:not([type="checkbox"]):not([type="radio"]):focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.field textarea { resize: vertical; min-height: 116px; }
.field input:disabled { background: var(--soft); color: var(--muted); }
.job-pick { display: grid; gap: 8px; }
.inline { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.inline input[type="date"] { flex: 1 1 180px; width: auto; }
.check { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px 0 14px; border-radius: var(--r-full); border: 1px solid var(--line); font-size: 15px; font-weight: 500; cursor: pointer; }
.check:hover { border-color: var(--ink); }
.check:has(input:checked) { border-color: var(--ink); background: var(--soft); }
.check input { width: 18px; height: 18px; margin: 0; accent-color: var(--ink); }
.err { margin: 0; color: var(--bad); font-size: 14px; font-weight: 500; }
.err:empty { display: none; }
.hint { margin: 0; color: var(--muted); font-size: 13.5px; }
.meta-row { display: flex; justify-content: space-between; gap: 8px; }
.counter { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.pill-radio { position: relative; display: inline-flex; }
.pill-radio input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
.pill-radio span { display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: var(--r-full); border: 1px solid var(--line); background: var(--canvas); color: var(--body); font-size: 15px; font-weight: 500; transition: transform .12s var(--ease); }
.pill-radio:hover span { border-color: var(--ink); color: var(--ink); }
.pill-radio:active span { transform: scale(.97); }
.pill-radio input:checked + span { background: var(--ink); border-color: var(--ink); color: #fff; }
.pill-radio input:focus-visible + span { outline: 2px solid var(--ink); outline-offset: 3px; }
.cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.card-radio { position: relative; display: grid; gap: 4px; padding: 16px 16px 16px 46px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--canvas); cursor: pointer; }
.card-radio:hover { border-color: var(--ink); }
.card-radio input { position: absolute; left: 16px; top: 18px; width: 18px; height: 18px; margin: 0; accent-color: var(--ink); }
.cr-t { font-weight: 700; }
.cr-d { font-size: 13.5px; color: var(--muted); }
.card-radio:has(input:checked) { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); background: var(--soft); }
.stepper { display: inline-flex; align-items: center; gap: 12px; }
.stepper button { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--field); background: var(--canvas); font-size: 20px; font-weight: 500; line-height: 1; cursor: pointer; transition: transform .12s var(--ease); }
.stepper button:hover { border-color: var(--ink); }
.stepper button:active { transform: scale(.94); }
.stepper output { min-width: 32px; text-align: center; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.unit { color: var(--muted); font-size: 14px; }
.submit-bar { position: sticky; bottom: 0; padding: 12px 0 calc(16px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--canvas) 72%, rgba(255, 255, 255, 0)); }

/* 아래에서 올라오는 창 */
#sheet-root { position: fixed; inset: 0; z-index: 50; }
.scrim { position: absolute; inset: 0; background: rgba(16, 24, 40, .5); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 90%; overflow: auto; overscroll-behavior: contain; display: grid; gap: 14px; padding: 24px 20px calc(20px + env(safe-area-inset-bottom)); border-radius: var(--r-lg) var(--r-lg) 0 0; background: var(--canvas); animation: sheet-up .25s var(--ease); }
.sheet h2 { margin: 0; font-size: 21px; font-weight: 700; }
.sheet-sub { margin: -6px 0 0; color: var(--muted); font-size: 15px; }
.sheet-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
.sheet-actions .btn { flex: 1; }
.check-line { margin: 0; padding: 12px 14px; border-radius: var(--r-sm); background: var(--soft); color: var(--muted); font-size: 15px; font-weight: 500; }
.check-line.ok { background: var(--ok-bg); color: var(--ok); }
.check-line.bad { background: var(--bad-bg); color: var(--bad); }
.share-text { width: 100%; padding: 14px; border-radius: var(--r-sm); border: 1px solid var(--field); background: var(--soft); font-size: 15px; line-height: 1.6; resize: none; }
@media (min-width: 640px) {
  .sheet { left: 50%; right: auto; bottom: auto; top: 50%; width: min(520px, calc(100% - 32px)); padding: 28px; border-radius: var(--r-lg); transform: translate(-50%, -50%); animation: none; }
  .sheet-actions .btn { flex: none; min-width: 112px; }
}
@keyframes sheet-up { from { transform: translateY(28px); } to { transform: none; } }

/* 알림 */
.toast { position: fixed; left: 50%; bottom: 24px; z-index: 60; max-width: calc(100% - 32px); padding: 12px 18px; border-radius: var(--r-sm); background: var(--ink); color: #fff; font-size: 15px; font-weight: 500; text-align: center; opacity: 0; pointer-events: none; transform: translate(-50%, 16px); transition: opacity .2s, transform .2s var(--ease); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
body.has-bar .toast { bottom: 96px; }

.loading { margin: 0; padding: 56px 0; color: var(--muted); text-align: center; }
.prose { display: grid; gap: 12px; }
.prose h2 { margin: 16px 0 0; font-size: 20px; font-weight: 700; }
.prose h2:first-child { margin-top: 0; }
.prose p, .prose ul { margin: 0; max-width: 62ch; color: var(--body); }
.prose ul { padding-left: 20px; display: grid; gap: 4px; }
.foot { margin-top: 32px; padding-bottom: 48px; color: var(--muted); font-size: 14px; }
.foot p { margin: 0; padding-top: 24px; border-top: 1px solid var(--line-soft); }
.foot a { color: var(--muted); }
body.has-bar .foot { padding-bottom: 120px; }

/* 다가오는 채용 일정 (게시판 위) */
.upcoming { margin: 0 0 40px; }
.upcoming .board-head { justify-content: space-between; }
.upcoming .board-head h2 { font-size: 22px; }
.upcoming .link { --ul: 0px; font-size: 15px; }
.up-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 10px; }
.up { display: grid; gap: 4px; min-height: 44px; padding: 14px 16px; border-radius: var(--r-md); background: var(--soft); color: var(--ink); text-decoration: none; transition: transform .2s var(--ease); }
.up:hover { transform: translateY(-2px); }
.up-date { font-size: 13.5px; font-weight: 600; color: var(--accent-text); font-variant-numeric: tabular-nums; }
.up-what b { font-weight: 700; }
.up-tag { display: inline-flex; align-items: center; min-height: 20px; margin-left: 2px; padding: 0 7px; border-radius: var(--r-full); background: var(--accent-soft); color: var(--accent-text); font-size: 12px; font-weight: 600; vertical-align: 1px; }

/* 채용 일정 화면 */
.jobs-lead { margin: 0 0 6px; }
.jobs-check { margin: 0 0 24px; padding: 12px 14px; border-radius: var(--r-sm); background: var(--soft); color: var(--body); font-size: 14px; }
.jobs { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
.job { display: grid; gap: 10px; padding: 22px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--canvas); scroll-margin-top: calc(var(--top-h) + 16px); }
.job-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.job-title { margin: 0; font-size: 19px; font-weight: 700; line-height: 1.35; }
.job-tags { margin: 0; color: var(--muted); font-size: 14.5px; }
.job-dates { display: grid; gap: 0; margin: 4px 0 0; border-top: 1px solid var(--line-soft); }
.job-dates div { display: grid; grid-template-columns: 84px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
.job-dates dt { color: var(--muted); font-size: 14px; font-weight: 500; }
.job-dates dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.job-dates .next dd { color: var(--accent-text); }
.dleft { display: inline-flex; align-items: center; min-height: 22px; margin-left: 6px; padding: 0 8px; border-radius: var(--r-full); background: var(--ok-bg); color: var(--ok); font-size: 12.5px; font-weight: 700; }
.dleft.done { background: var(--any-bg); color: var(--any); }
.job-note { margin: 0; color: var(--body); font-size: 14.5px; }
.job-act { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 4px; }
.job-act .link { --ul: 11px; min-height: 44px; display: inline-flex; align-items: center; }
.job-src { margin: 0; color: var(--muted); font-size: 13px; }
.job-src a { color: var(--muted); }
.pill.js-open { background: var(--ok-bg); color: var(--ok); }
.pill.js-soon { background: var(--wait-bg); color: var(--wait); }
.pill.js-process { background: var(--accent-soft); color: var(--accent-text); }
@media (max-width: 480px) { .job { padding: 18px; } .job-dates div { grid-template-columns: 72px 1fr; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* ---------- 로그인 · 가입 ---------- */
.check-line:empty { display: none; }
.auth { padding-top: 28px; }
.auth-tabs { display: flex; gap: 4px; padding: 4px; border-radius: var(--r-full); background: var(--soft); width: max-content; }
.auth-tabs a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: var(--r-full); color: var(--muted); font-weight: 600; text-decoration: none; }
.auth-tabs a.on { background: var(--canvas); color: var(--ink); box-shadow: 0 1px 2px rgba(16, 24, 40, .08); }
.auth .form h1 { margin-top: 20px; }
.show-pw { justify-self: start; }
.note { margin: 0; padding: 12px 14px; border-radius: var(--r-sm); background: var(--accent-soft); color: var(--accent-text); font-size: 15px; line-height: 1.55; }
.note.ok { background: var(--ok-bg); color: var(--ok); }
.note.warn { background: var(--wait-bg); color: var(--wait); }
.note a { color: inherit; font-weight: 600; }
.auth-switch { margin: 0; text-align: center; color: var(--muted); font-size: 15px; }
.auth-switch a { color: var(--accent-text); font-weight: 600; }
.as-who { margin: 0; color: var(--muted); font-size: 15px; }
.me-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; }
.me-head .page-h { margin-bottom: 0; }
.account { display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 10px; border: 1px solid var(--line); border-radius: var(--r-md); }
.acc-main { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
.acc-main b { color: var(--ink); }
.acc-id { color: var(--muted); font-size: 14px; }

/* ---------- 메시지 ---------- */
.nav-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; margin-left: 4px; padding: 0 5px; border-radius: 9px; background: #d92d20; color: #fff; font-size: 11px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.chat-lead { margin: 0 0 20px; }
.rooms { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line-soft); }
.room-row { display: flex; align-items: center; gap: 12px; min-height: 72px; padding: 12px 4px; border-bottom: 1px solid var(--line-soft); color: inherit; text-decoration: none; }
.room-row:hover { background: var(--soft); }
.room-row .avatar { background: var(--accent-soft); color: var(--accent-text); }
.rr-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.rr-top { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.rr-top b { color: var(--ink); white-space: nowrap; }
.rr-sub { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rr-last { color: var(--muted); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.room-row.unread .rr-last { color: var(--ink); font-weight: 600; }
.rr-side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.rr-time { color: var(--muted); font-size: 13px; white-space: nowrap; }
.rr-count { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: #d92d20; color: #fff; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }

.room-head { position: sticky; top: var(--top-h); z-index: 5; display: flex; align-items: center; gap: 12px; margin: 0 -24px; padding: 10px 24px; background: rgba(255, 255, 255, .96); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line-soft); }
.room-head .back { margin: 0; flex: none; }
.rh-main { flex: 1; min-width: 0; }
.rh-title { margin: 0; font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rh-title span { color: var(--muted); font-weight: 500; font-size: 15px; }
.rh-sub { margin: 0; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.room-head .link { flex: none; }
.room-note { margin: 16px 0 0; color: var(--muted); font-size: 13px; text-align: center; }
.msgs { list-style: none; margin: 8px 0 0; padding: 0 0 8px; display: flex; flex-direction: column; gap: 4px; }
.msg-info { padding: 40px 0; text-align: center; color: var(--muted); }
.msg-day { display: flex; justify-content: center; margin: 16px 0 8px; }
.msg-day span { padding: 4px 12px; border-radius: var(--r-full); background: var(--soft); color: var(--muted); font-size: 13px; }
.msg { display: flex; flex-direction: column; align-items: flex-start; max-width: 100%; }
.msg.head { margin-top: 10px; }
.msg-nick { margin: 0 0 4px 4px; color: var(--body); font-size: 13px; font-weight: 600; }
.msg-line { display: flex; align-items: flex-end; gap: 6px; max-width: min(78%, 520px); }
.msg.mine { align-items: flex-end; }
.msg.mine .msg-line { flex-direction: row-reverse; }
.bubble { padding: 9px 13px; border-radius: 18px; border-top-left-radius: 6px; background: var(--soft); color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }
.msg.mine .bubble { background: var(--accent); color: var(--on-accent); border-top-left-radius: 18px; border-top-right-radius: 6px; }
.bubble a { color: inherit; text-decoration: underline; }
.msg-time { flex: none; color: var(--muted); font-size: 12px; white-space: nowrap; }
.composer { max-width: 760px; margin: 0 auto; padding: 10px 24px calc(10px + env(safe-area-inset-bottom)); display: flex; align-items: flex-end; gap: 10px; }
.composer textarea { flex: 1; min-height: 44px; max-height: 140px; padding: 10px 14px; border: 1px solid var(--field); border-radius: 22px; font: inherit; font-size: 16px; line-height: 1.4; resize: none; background: var(--canvas); color: var(--ink); }
.composer .btn { flex: none; border-radius: 22px; }
body.in-room .foot { display: none; }
body.in-room main { padding-bottom: 96px; }
@media (max-width: 480px) { .composer { padding-left: 16px; padding-right: 16px; } .room-head { margin: 0 -16px; padding: 10px 16px; } }

/* ---------- 마이페이지 ---------- */
.profile-card { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px 20px; margin: 16px 0 8px; padding: 24px; border: 1px solid var(--line); border-radius: var(--r-lg); }
.avatar-lg { width: 64px; height: 64px; font-size: 26px; background: var(--accent-soft); color: var(--accent-text); }
.pc-main { flex: 1 1 220px; min-width: 0; }
.pc-main p { margin: 0; }
.pc-name { color: var(--ink); font-size: 22px; font-weight: 700; }
.pc-id { margin-top: 2px !important; color: var(--muted); font-size: 14px; }
.pc-tags { margin-top: 10px !important; font-size: 14px; }
.pc-intro { margin-top: 8px !important; color: var(--body); }
.pc-act { display: flex; gap: 8px; flex-wrap: wrap; }
.static { margin: 0; min-height: 44px; display: flex; align-items: center; gap: 6px; color: var(--ink); }
.row-end { display: flex; justify-content: flex-end; }
.pw-form { margin-top: 40px; }
@media (max-width: 480px) { .profile-card { padding: 18px; } .pc-act { width: 100%; } .pc-act .btn { flex: 1; } }
.counter { white-space: nowrap; flex: none; }

/* ---------- 채용 일정: 거르기 (직무·채용형태·기업·지역·산업·검색) ---------- */
.job-filter { margin: 20px 0 8px; border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.jf-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 4px 16px 0; border-bottom: 1px solid var(--line-soft); }
.jf-tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.jf-tabs::-webkit-scrollbar { display: none; }
.jf-tab { position: relative; min-height: 48px; padding: 0 12px; border: 0; background: none; color: var(--muted); font: inherit; font-size: 15px; font-weight: 600; white-space: nowrap; cursor: pointer; }
.jf-tab:hover { color: var(--ink); }
.jf-tab.on { color: var(--accent-text); }
.jf-tab.on::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent); }
.jf-dot { display: inline-block; width: 6px; height: 6px; margin-left: 4px; border-radius: 50%; background: var(--accent); vertical-align: 3px; }
.jf-search { flex: 1 1 220px; max-width: 320px; margin: 6px 0; }
.jf-panel { padding: 14px 16px 16px; }
.jf-label { margin: 0 0 8px; color: var(--muted); font-size: 13px; font-weight: 600; }
.jf-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.jf-sub { margin-top: 14px; padding: 14px; border-radius: var(--r-md); background: var(--soft); }
.jf-sub .jchip { background: var(--canvas); border: 1px solid var(--line); }
.jchip { display: inline-flex; align-items: center; gap: 4px; min-height: 36px; padding: 0 12px; border-radius: var(--r-full); background: var(--soft); color: var(--body); font-size: 14px; font-weight: 500; text-decoration: none; white-space: nowrap; }
.jchip .num { color: var(--muted); font-size: 12px; }
.jchip:hover { color: var(--ink); background: var(--line-soft); }
.jchip.zero { color: var(--muted); }
.jchip.on, .jf-sub .jchip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.jchip.on .num { color: inherit; opacity: .8; }
.jf-active { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; }
.jf-pill { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 10px 0 12px; border-radius: var(--r-full); background: var(--accent-soft); color: var(--accent-text); font-size: 14px; font-weight: 600; text-decoration: none; }
.jf-pill span { font-size: 16px; line-height: 1; }
.jf-reset { margin-left: 4px; font-size: 14px; }
.jobs-count { margin: 12px 0 0; }
.job-cats { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
.cat-tag { padding: 3px 9px; border-radius: var(--r-full); background: var(--accent-soft); color: var(--accent-text); font-size: 13px; font-weight: 600; }
.cat-tag.on { outline: 2px solid currentColor; outline-offset: 1px; }
.job-meta { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
@media (max-width: 480px) {
  .jf-top { padding: 4px 8px 0; }
  .jf-search { max-width: none; margin: 0 4px 10px; }
  .jf-panel { padding: 12px; }
  .jchip { min-height: 40px; }
}

/* 마이페이지 프로필: 지원 직무·학과·학년 */
.pc-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 16px; margin: 12px 0 0; }
.pc-facts div { min-width: 0; }
.pc-facts dt { font-size: 13px; color: var(--muted); }
.pc-facts dd { margin: 2px 0 0; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.pc-facts dd.muted { font-weight: 400; font-size: 14px; }
@media (max-width: 480px) { .pc-facts { grid-template-columns: 1fr 1fr; } }
.field-row { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; }
@media (max-width: 480px) { .field-row { grid-template-columns: 1fr; } }
.tag-prof { font-size: 14px; color: var(--muted); }

/* 같은 스터디 사람 프로필 */
.p-open { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; min-height: 44px; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; border-radius: var(--r-sm); }
.p-open .p-main { flex: 1; min-width: 0; }
.p-more { flex: none; font-size: 13px; color: var(--muted); }
.p-open:hover .p-name, .p-open:focus-visible .p-name { text-decoration: underline; text-underline-offset: 3px; }
.appl-who .tag-nick.link { padding: 0; border: 0; background: none; min-height: 32px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.rh-people { display: block; max-width: 100%; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; min-height: 32px; }
.prof-list { display: grid; gap: 12px; max-height: 60vh; overflow: auto; margin: 12px 0; }
.prof-card { border: 1px solid var(--line-soft); border-radius: var(--r-md, 12px); padding: 14px 16px; }
.prof-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.prof-name { font-weight: 700; font-size: 17px; margin: 0; }
.prof-dl { display: grid; gap: 6px; margin: 0; }
.prof-dl div { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px; }
.prof-dl dt { color: var(--muted); font-size: 14px; }
.prof-dl dd { margin: 0; overflow-wrap: anywhere; }

/* 스터디 정보 */
.group-hint { margin: 0 0 4px; }
.pc-more { display: grid; gap: 4px; margin: 12px 0 0; font-size: 14px; }
.pc-more div { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px; }
.pc-more dt { color: var(--muted); }
.pc-more dd { margin: 0; overflow-wrap: anywhere; }
.pc-hint { margin: 12px 0 0 !important; font-size: 14px; }
@media (max-width: 480px) { .pc-more div { grid-template-columns: 1fr; gap: 0; } .prof-dl div { grid-template-columns: 1fr; gap: 0; } }

/* 모집 기간 */
.tk-due { display: block; font-size: 14px; color: var(--body); }
.tk-due.hot { color: var(--bad); font-weight: 600; }
.pill.st-soon { background: var(--soft); color: var(--ink); }
.pill.st-ended { background: var(--any-bg); color: var(--any); }
.inline.range { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.inline.range input { flex: 1 1 150px; min-width: 0; }
.stepper .cap-input { width: 88px !important; text-align: center; font-variant-numeric: tabular-nums; }


/* =====================================================================
   다듬은 디자인 (2026-11 · "면접 대기표")
   - 생각: 면접장 대기실의 번호표. 모든 모집 글은 왼쪽에 D-day가 적힌 절취선 달린 대기표다.
     과감한 건 이 대기표 하나뿐, 나머지는 조용히.
   - 색: 사용자가 고른 파랑은 그대로 두되 한 톤 깊은 코발트로, 글자는 정장 남색, 바탕은 옅은 안개색.
   - 모서리: 버튼·입력 12px, 카드 18px, 큰 판 24px (위계에 따라 다르게)
   ===================================================================== */
:root {
  --canvas: #ffffff;
  --page: #f4f6fa;          /* 안개색 바탕: 흰 카드가 떠 보이게 */
  --soft: #eef1f6;
  --strong: #e3e8f0;
  --ink: #142036;           /* 정장 남색 */
  --body: #39445a;
  --muted: #667089;
  --line: #e1e6ee;
  --line-soft: #e9edf3;
  --field: #c6cdd8;
  --brand: #3563ec;
  --accent: #2a52d6;        /* 흰 글자 대비 6.2:1 */
  --accent-hover: #2447bd;
  --accent-press: #1e3da3;
  --accent-soft: #e8eefd;
  --accent-text: #1e3da3;
  --accent-disabled: #bccbf6;
  --perf: #c9d1de;          /* 절취선 */
  --shadow: 0 1px 2px rgba(20, 32, 54, .04), 0 8px 24px -12px rgba(20, 32, 54, .14);
  --shadow-lift: 0 2px 4px rgba(20, 32, 54, .05), 0 22px 44px -20px rgba(20, 32, 54, .28);
  --r-sm: 12px;
  --r-md: 18px;
  --r-lg: 24px;
}
body { background: var(--page); }
h1, h2, h3 { font-weight: 750; letter-spacing: -.035em; }

/* 머리 */
.top { background: rgba(255, 255, 255, .86); border-bottom-color: var(--line); }
.logo-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--ink); font-size: 14px; position: relative; overflow: hidden; }
.logo-mark::after { content: ""; position: absolute; left: 0; right: 0; bottom: 6px; border-top: 1.5px dashed rgba(255, 255, 255, .45); }
.logo-text { font-weight: 800; letter-spacing: -.05em; }
.nav a { font-weight: 550; }
.nav a::after { height: 2px; bottom: 4px; background: var(--ink); }
.demo { background: var(--ink); color: #dfe5f0; border-bottom: 0; }
.demo-text { color: #c4cddc; }
.demo-tag { background: #fff; color: var(--ink); }
.demo .link, .demo .demo-pick { color: #fff; }
.demo .link::before { background: rgba(255, 255, 255, .35); }
.demo-pick select { border-color: rgba(255, 255, 255, .25); background: rgba(255, 255, 255, .08); color: #fff; }
.demo-pick select option { color: var(--ink); background: #fff; }

/* 버튼 */
.btn { border-radius: var(--r-sm); font-weight: 650; letter-spacing: -.02em; border-color: var(--line); }
.btn:hover { border-color: var(--field); background: var(--canvas); }
.btn-primary { box-shadow: 0 1px 0 rgba(255, 255, 255, .18) inset, 0 1px 2px rgba(20, 32, 54, .18); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

/* 첫 화면 */
.hero { padding: 56px 0 64px; gap: 56px; }
.hero h1 { font-size: clamp(38px, 5.6vw, 62px); line-height: 1.14; font-weight: 800; letter-spacing: -.055em; color: var(--ink); }
.hero-sub { margin-top: 22px; font-size: 18px; line-height: 1.6; color: var(--body); }
.hero-act { margin-top: 30px; }
.blob { display: none; }
.deck { position: absolute; inset: 8px 0 8px 6%; border-radius: 28px; background: var(--ink); overflow: hidden; }
/* 대기실 벽의 번호판처럼, 큰 D 글자가 옅게 깔린다 */
.deck::before { content: "D-3"; position: absolute; right: -10px; bottom: -46px; font-size: 220px; font-weight: 800; letter-spacing: -.08em; line-height: 1; color: rgba(255, 255, 255, .06); }
.deck::after { content: ""; position: absolute; left: 28px; right: 28px; top: 50%; border-top: 1.5px dashed rgba(255, 255, 255, .16); }
.mini { padding: 0; gap: 0; overflow: hidden; border-radius: var(--r-md); box-shadow: 0 30px 60px -24px rgba(0, 0, 0, .55); }
.mini .dbadge { align-self: stretch; height: auto; width: 76px; border-radius: 0; }
.mini .tk-body { padding: 16px 18px 16px 16px; }
.mini.m1 { top: 56px; left: 0; transform: rotate(-2.5deg); }
.mini.m2 { bottom: 48px; right: 4%; transform: rotate(1.5deg); }
body:not(.entered) .hero[data-enter] .mini.m1 { animation: rise-m1 .7s .1s var(--ease) both; }
body:not(.entered) .hero[data-enter] .mini.m2 { animation: rise-m2 .7s .22s var(--ease) both; }
@keyframes rise-m1 { from { opacity: 0; transform: translateY(18px) rotate(-2.5deg); } to { opacity: 1; transform: rotate(-2.5deg); } }
@keyframes rise-m2 { from { opacity: 0; transform: translateY(18px) rotate(1.5deg); } to { opacity: 1; transform: rotate(1.5deg); } }

/* 대기표: 왼쪽 번호(D-day) + 절취선 + 내용 */
.tickets { gap: 14px; }
.ticket { --stub: 84px; padding: 0; gap: 0; align-items: stretch; border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow); overflow: hidden; transition: transform .2s var(--ease); }
.ticket::before, .ticket::after { content: ""; position: absolute; z-index: 1; left: calc(var(--stub) - 9px); width: 18px; height: 18px; border-radius: 50%; background: var(--page); border: 1px solid var(--line); box-shadow: none; opacity: 1; inset: auto; }
.ticket::before { top: -10px; left: calc(var(--stub) - 9px); }
.ticket::after { bottom: -10px; left: calc(var(--stub) - 9px); }
.ticket:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.ticket:hover::after { opacity: 1; }
.dbadge { width: var(--stub, 76px); height: auto; min-height: 100%; border-radius: 0; gap: 6px; background: var(--soft); border-right: 1.5px dashed var(--perf); padding: 18px 6px; }
.dbadge b { font-size: 22px; font-weight: 800; letter-spacing: -.05em; color: var(--ink); }
.dbadge small { font-size: 12px; color: var(--muted); }
.urgent .dbadge { background: var(--accent); border-right-color: rgba(255, 255, 255, .45); }
.urgent .dbadge b, .urgent .dbadge small { color: #fff; }
.mini.urgent .dbadge { background: var(--accent); }
.tk-body { padding: 18px 20px 16px; gap: 7px; }
.company { font-size: 18px; font-weight: 750; letter-spacing: -.04em; }
.tk-title { color: var(--ink); font-weight: 550; }
.tk-meta { font-size: 13.5px; }
.tk-due { font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tk-due.hot { color: var(--bad); }
.tk-foot { margin-top: 4px; padding-top: 10px; border-top: 1px solid var(--line-soft); }
.seats i { width: 8px; height: 8px; }
.seats i.on { background: var(--ink); }
.done .ticket { background: var(--canvas); box-shadow: none; opacity: .78; }
.done .dbadge { background: var(--soft); }

/* 상태·조건 표시: 작은 점 + 글자로 조용하게 */
.pill { min-height: 24px; padding: 0 10px 0 9px; gap: 6px; background: transparent !important; border: 1px solid var(--line); font-weight: 650; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.st-open { color: var(--ok); }
.chip { border-radius: 7px; font-weight: 650; }

/* 목록 머리와 거르기 */
.board-head h2 { font-size: 28px; font-weight: 800; letter-spacing: -.045em; }
.search input { border-radius: var(--r-sm); border-color: var(--line); background: var(--canvas); box-shadow: var(--shadow); }
.fchips { gap: 4px; padding: 4px; border-radius: 14px; background: var(--strong); }
.fchip { min-height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--body); font-weight: 600; }
.fchip:hover { color: var(--ink); background: rgba(255, 255, 255, .6); }
.fchip.on { background: var(--canvas); color: var(--ink); box-shadow: 0 1px 2px rgba(20, 32, 54, .12); }
@media (max-width: 599px) { .fchips { gap: 2px; } }

/* 다가오는 일정 */
.up { background: var(--canvas); border: 1px solid var(--line); box-shadow: var(--shadow); }
.up-date { color: var(--accent); }

/* 빈 화면·안내 상자 */
.empty { background: var(--canvas); border: 1.5px dashed var(--field); }

/* 글 상세: 큰 대기표 */
.detail { gap: 24px; }
.d-head { padding: 0; border-radius: var(--r-lg); background: var(--canvas); border: 1px solid var(--line); box-shadow: var(--shadow); overflow: hidden; gap: 0; align-items: stretch; }
.d-stub { width: 120px; height: auto; min-height: 132px; border-radius: 0; background: var(--ink); border-right: 2px dashed rgba(255, 255, 255, .28); }
.d-stub .dd { font-size: 32px; font-weight: 800; color: #fff; letter-spacing: -.055em; }
.d-stub .dd-date { color: #b9c3d6; }
.d-stub.urgent { background: var(--accent); }
.d-stub.urgent .dd { color: #fff; }
.d-titles { padding: 20px 24px; align-self: center; }
.d-titles h1 { font-weight: 800; letter-spacing: -.045em; }
.facts { padding: 4px 22px; border-top: 0; border-radius: var(--r-md); background: var(--canvas); border: 1px solid var(--line); }
.facts div:nth-last-child(-n+2) { border-bottom: 0; }
.rulebox { border-radius: var(--r-md); }
.d-sec { padding: 22px; border-radius: var(--r-md); background: var(--canvas); border: 1px solid var(--line); }
.d-sec.host-panel { background: var(--canvas); border: 1.5px solid var(--ink); }
.person:last-child { border-bottom: 0; }
.avatar { background: var(--soft); font-weight: 750; }
@media (max-width: 480px) {
  .d-stub { width: 92px; min-height: 112px; }
  .d-stub .dd { font-size: 26px; }
  .d-titles { padding: 16px 18px; }
  .facts { grid-template-columns: 1fr; padding: 2px 18px; }
  .facts div:nth-last-child(2) { border-bottom: 1px solid var(--line-soft); }
  .d-sec { padding: 18px; }
}

/* 입력 화면: 묶음마다 흰 판 */
.form { gap: 20px; }
.form > h1, .form > .lead { padding: 0 2px; }
.lead { margin: -8px 0 4px; }
.group { padding: 24px; border-radius: var(--r-lg); background: var(--canvas); border: 1px solid var(--line); box-shadow: var(--shadow); }
.group + .group { padding-top: 24px; border-top: 1px solid var(--line); }
.group legend { float: left; font-size: 19px; font-weight: 800; }
.field input:not([type="checkbox"]):not([type="radio"]), .field select, .field textarea { border-color: var(--field); background: #fbfcfd; }
.field input:not([type="checkbox"]):not([type="radio"]):focus, .field select:focus, .field textarea:focus { background: #fff; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.pill-radio span { border-radius: 10px; font-weight: 550; }
.pill-radio input:checked + span { background: var(--ink); border-color: var(--ink); }
.card-radio { border-radius: var(--r-md); }
.card-radio:has(input:checked) { background: #f7f9fd; }
.check { border-radius: 10px; }
.submit-bar { background: linear-gradient(to top, var(--page) 72%, rgba(244, 246, 250, 0)); }
@media (max-width: 480px) { .group { padding: 20px 18px; border-radius: var(--r-md); } }

/* 마이페이지·채용·메시지 */
.profile-card { background: var(--canvas); border: 1px solid var(--line); box-shadow: var(--shadow); }
.job { border-radius: var(--r-md); box-shadow: var(--shadow); }
.job-filter { background: var(--canvas); box-shadow: var(--shadow); }
.jobs-check { background: var(--canvas); border: 1px solid var(--line); }
.rooms { background: var(--canvas); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.room-row { padding-left: 16px; padding-right: 16px; }
.room-row:last-child { border-bottom: 0; }
.room-head { background: rgba(244, 246, 250, .94); }
.auth-tabs { background: var(--strong); }
.foot p { border-top-color: var(--line); }
.actionbar { background: rgba(255, 255, 255, .94); }
.prof-card { background: var(--canvas); }
@media (prefers-reduced-motion: reduce) { .mini.m1, .mini.m2 { animation: none !important; } }
.ticket .tk-body { display: flex; flex-direction: column; gap: 7px; }
.ticket .tk-foot { margin-top: auto; }

/* 채용 달력 */
.view-switch { display: inline-flex; gap: 4px; padding: 4px; margin: 4px 0 0; border-radius: 14px; background: var(--strong); }
.vs-tab { display: inline-flex; align-items: center; min-height: 40px; padding: 0 18px; border-radius: 10px; color: var(--body); font-weight: 650; text-decoration: none; }
.vs-tab:hover { color: var(--ink); background: rgba(255, 255, 255, .6); }
.vs-tab.on { background: var(--canvas); color: var(--ink); box-shadow: 0 1px 2px rgba(20, 32, 54, .12); }
.cal { margin-top: 12px; padding: 18px; border-radius: var(--r-lg); background: var(--canvas); border: 1px solid var(--line); box-shadow: var(--shadow); }
.cal-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-bottom: 12px; }
.cal-title { margin: 0 4px; font-size: 22px; font-weight: 800; letter-spacing: -.04em; font-variant-numeric: tabular-nums; min-width: 7.5em; text-align: center; }
.cal-nav { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--canvas); font-size: 22px; line-height: 1; cursor: pointer; color: var(--ink); }
.cal-nav:hover { border-color: var(--field); background: var(--soft); }
.cal-today { min-height: 40px; }
.cal-legend { margin: 0 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; color: var(--muted); font-size: 13.5px; }
.lg { display: inline-flex; align-items: center; gap: 6px; }
.lg::before { content: ""; width: 10px; height: 10px; border-radius: 3px; }
.lg.due::before { background: var(--ink); }
.lg.iv::before { background: var(--accent); }
.cal-dow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; padding: 0 0 6px; color: var(--muted); font-size: 13px; font-weight: 600; text-align: center; }
.cal-dow span:first-child { color: var(--bad); }
.cal-dow span:last-child { color: var(--accent); }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }

  }

  JOBS.forEach(function (j) { KEY_MAP[squash(j)] = squash(j); });

  /* 정해진 직무 목록에 들어가면 그 이름, 아니면 '' */
  function jobCategory(job) {

  /* 날짜: 모두 한국 시간 기준 'YYYY-MM-DD' */
  const DAY = 86400000;

  function todayKST(now) {

  }
  function isYmd(s) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return false;
    const t = ymdToUTC(s);
    return !isNaN(t) && new Date(t).toISOString().slice(0, 10) === s;
  }
  function ymdToUTC(ymd) {

    if (n == null) return '미정';

  const DATE_FMT = (typeof Intl !== 'undefined' && Intl.DateTimeFormat)

  function dateLabel(ymd) {

    const t = new Date(ymdToUTC(ymd));
    if (DATE_FMT && DATE_FMT.formatToParts) {

  function emit() { listeners.forEach(function (fn) { try { fn(); } catch (e) { console.error(e); } }); }

  function toList(map) {
    return Object.keys(map || {}).map(function (k) { return Object.assign({ uid: k }, map[k]); });
  }
  function fromDoc(snap) {
    const d = snap.data();
    if (!d) return null;
    const members = toList(d.members).sort(function (a, b) {
      if (a.role === 'host') return -1;
      if (b.role === 'host') return 1;
      return (a.at || 0) - (b.at || 0);
    });
    const applicants = toList(d.applicants).sort(function (a, b) { return (a.at || 0) - (b.at || 0); });
    return {
      id: snap.id, company: d.company, job: d.job, jobKey: d.jobKey, stage: d.stage,
      interviewDate: d.interviewDate || null, recruitStart: d.recruitStart || '', recruitEnd: d.recruitEnd || '', mode: d.mode, place: d.place || '', capacity: d.capacity,
      jobRule: d.jobRule, joinMode: d.joinMode, intro: d.intro || '', hostId: d.hostId, closed: !!d.closed,
      createdAt: d.createdAt || 0, members: members, applicants: applicants
    };
  }

  function failReason(err) {
    const code = (err && err.code) || '';
    if (code === 'permission-denied') return '처리하지 못했어요. 그사이 모집 상태가 바뀌었을 수 있어요. 새로고침 후 다시 해 보세요.';
    if (code === 'unavailable' || code === 'deadline-exceeded') return '인터넷 연결이 불안정해요. 잠시 뒤 다시 해 보세요.';
    return '처리하지 못했어요. 잠시 뒤 다시 해 보세요.';
  }
  function ref(id) { return fs.doc(db, 'posts', id); }
  function write(id, data) {
    if (!signedIn()) return Promise.resolve(needLogin());
    return fs.updateDoc(ref(id), data).then(function () { return { ok: true }; }, function (err) {
      console.error('[면스방] 저장 실패', err);
      return { ok: false, reason: failReason(err) };
    });
  }
  function asHost(id) {
    if (!signedIn()) return '로그인하고 이용해 주세요.';
    const p = cache.get(id);
    if (!p) return '글을 찾을 수 없어요.';
    if (p.hostId !== uid) return '방장만 할 수 있어요.';
    return null;
  }
  function entry(nick, job, intro, at, who) {
    const j = R.canonicalJob(job);
    const e = { nick: nick, job: j, jobKey: R.jobKey(j), intro: String(intro || '').trim().slice(0, 60), at: at };
    /* 학과·학년은 프로필에 적어 둔 경우에만 같이 보낸다 */
    if (who && who.major) e.major = String(who.major).slice(0, 20);
    if (who && who.grade && R.GRADES.indexOf(who.grade) >= 0) e.grade = who.grade;
    return e;
  }
  const profCache = new Map();
  function myProfile() { return { major: (prof.data && prof.data.major) || '', grade: (prof.data && prof.data.grade) || '' }; }

  function setUser(u) {
    user = u || null;
    uid = user ? user.uid : null;
  }
  function signedIn() { return !!(user && !user.isAnonymous && R.emailToId(user.email)); }
  function authReason(err) {
    const code = (err && err.code) || '';
    if (code === 'auth/email-already-in-use' || code === 'auth/credential-already-in-use') return { field: 'username', msg: '이미 쓰고 있는 아이디예요. 다른 아이디를 적어 주세요.' };
    if (code === 'auth/invalid-credential' || code === 'auth/wrong-password' || code === 'auth/user-not-found' || code === 'auth/invalid-login-credentials') return { msg: '아이디 또는 비밀번호가 맞지 않아요.' };
    if (code === 'auth/weak-password') return { field: 'password', msg: '비밀번호를 더 길게 만들어 주세요.' };
    if (code === 'auth/too-many-requests') return { msg: '시도가 너무 많았어요. 잠시 뒤 다시 해 보세요.' };
    if (code === 'auth/network-request-failed') return { msg: '인터넷 연결이 불안정해요. 잠시 뒤 다시 해 보세요.' };
    if (code === 'auth/operation-not-allowed') return { msg: '지금은 가입을 받을 수 없어요. 운영자에게 알려 주세요.' };
    return { msg: '처리하지 못했어요. 잠시 뒤 다시 해 보세요.' };
  }
  function authFail(err) {
    console.error('[면스방] 로그인 오류', err && err.code);
    const r = authReason(err);
    const out = { ok: false, reason: r.msg };
    if (r.field) { out.errors = {}; out.errors[r.field] = r.msg; }
    return out;
  }
  function needLogin() { return { ok: false, reason: '로그인하고 이용해 주세요.', login: true }; }

  function msgFrom(ds) {
    const d = ds.data();
    return { id: ds.id, uid: d.uid, nick: d.nick, text: d.text, at: d.at || 0 };
  }
  function msgCol(id) { return fs.collection(db, 'posts', id, 'messages'); }
  function myRoomIds() {
    if (!signedIn()) return [];
    return Array.from(cache.values()).filter(function (p) { return R.memberOf(p, uid); }).map(function (p) { return p.id; });
  }
  /* 참가 중인 방이 바뀌면 미리보기 구독을 맞춘다 */
  function syncPreviews() {
    if (!fs) return;
    const want = new Set(myRoomIds());
    previewSubs.forEach(function (off, id) {
      if (!want.has(id)) { off(); previewSubs.delete(id); lastMsg.delete(id); recentMsgs.delete(id); }
    });
    want.forEach(function (id) {
      if (previewSubs.has(id)) return;
      const q = fs.query(msgCol(id), fs.orderBy('at', 'desc'), fs.limit(10));
      previewSubs.set(id, fs.onSnapshot(q, function (snap) {
        const list = snap.docs.map(msgFrom);
        recentMsgs.set(id, list);
        lastMsg.set(id, list.length ? list[0] : null);
        emit();
      }, function (err) {
        console.error('[면스방] 채팅 미리보기 오류', err && err.code);
        const off = previewSubs.get(id); if (off) off();
        previewSubs.delete(id);
      }));
    });
    if (room.id && !want.has(room.id)) closeRoom();
  }
  function syncProfile() {
    if (!fs) return;
    const want = signedIn() ? uid : null;
    if (prof.uid === want) return;
    if (prof.off) prof.off();
    prof = { uid: want, data: null, off: null };
    if (!want) return;
    prof.off = fs.onSnapshot(fs.doc(db, 'users', want), function (ds) {
      if (prof.uid !== want) return;
      prof.data = ds.exists() ? ds.data() : {};
      emit();
    }, function (err) { console.error('[면스방] 프로필 오류', err && err.code); });
  }
  function closeRoom() {
    if (room.off) room.off();
    room = { id: null, list: null, error: null, off: null };
  }
  function readKey() { return 'myeonsbang-read-' + uid; }
  function readMap() { try { return JSON.parse(lsGet(readKey()) || '{}') || {}; } catch (e) { return {}; } }

  function withTimeout(promise, ms) {
    return new Promise(function (resolve, reject) {
      const t = setTimeout(function () { reject(new Error('timeout')); }, ms);
      promise.then(function (v) { clearTimeout(t); resolve(v); }, function (e) { clearTimeout(t); reject(e); });
    });
  }

  async function start() {
    const cfg = root.MYEONSBANG_FIREBASE;
    if (!cfg || !cfg.apiKey) throw new Error('no-config');
    const mods = await Promise.all([
      import(SDK + 'firebase-app.js'), import(SDK + 'firebase-auth.js'), import(SDK + 'firebase-firestore.js')
    ]);
    const appMod = mods[0];
    authMod = mods[1];
    fs = mods[2];
    const app = appMod.initializeApp(cfg);
    auth = authMod.getAuth(app);
    try { db = fs.initializeFirestore(app, { experimentalAutoDetectLongPolling: true }); } catch (e) { db = fs.getFirestore(app); }
    await auth.authStateReady();
    setUser(auth.currentUser);
    authMod.onAuthStateChanged(auth, function (u) { setUser(u); syncPreviews(); syncProfile(); emit(); });

    await new Promise(function (resolve, reject) {
      let first = true;
      const q = fs.query(fs.collection(db, 'posts'), fs.orderBy('createdAt', 'desc'), fs.limit(200));
      fs.onSnapshot(q, function (snap) {
        snap.docChanges().forEach(function (ch) {
          if (ch.type === 'removed') { if (docState.get(ch.doc.id) !== 'watch') cache.delete(ch.doc.id); }
          else { const p = fromDoc(ch.doc); if (p) cache.set(p.id, p); }
        });
        if (first) { first = false; resolve(); }
        syncPreviews();
        syncProfile();
        emit();
      }, function (err) {
        console.error('[면스방] 목록 오류', err);
        if (first) { first = false; reject(err); }
      });
    });
  }

  const Store = {
    kind: 'live',

    init: function () { return withTimeout(start(), 20000); },
    subscribe: function (fn) { listeners.add(fn); return function () { listeners.delete(fn); }; },

    me: function () {
      const inn = signedIn();
      return {
        uid: uid, signedIn: inn, anon: !!(user && user.isAnonymous),
        username: inn ? R.emailToId(user.email) : '',
        nick: (inn && user.displayName) || lsGet(NICK_KEY),
        job: (inn && prof.data && prof.data.job) || lsGet(JOB_KEY),
        intro: (inn && prof.data && prof.data.intro) || '',
        major: (inn && prof.data && prof.data.major) || '',
        grade: (inn && prof.data && prof.data.grade) || '',
        extras: R.profileExtras(inn && prof.data ? prof.data : {}),
        joinedAt: inn && user.metadata && user.metadata.creationTime ? Date.parse(user.metadata.creationTime) : 0
      };
    },

    /* 다른 사람 프로필 (같은 스터디 사람끼리 볼 때 씀). 1분 동안은 다시 묻지 않는다 */
    profileOf: async function (who) {
      if (!signedIn() || !who) return null;
      const pick = function (d) { return Object.assign({ job: d.job || '', major: d.major || '', grade: d.grade || '', intro: d.intro || '' }, R.profileExtras(d)); };
      if (who === uid) return pick(prof.data || {});
      const c = profCache.get(who);
      if (c && Date.now() - c.at < 60000) return c.data;
      try {
        const ds = await fs.getDoc(fs.doc(db, 'users', who));
        const out = pick(ds.exists() ? ds.data() : {});
        profCache.set(who, { at: Date.now(), data: out });
        return out;
      } catch (err) {
        console.error('[면스방] 프로필 읽기 실패', err && err.code);
        return null;
      }
    },

    /* ---------- 마이페이지 ---------- */
    saveProfile: async function (f) {
      if (!signedIn()) return needLogin();
      const v = R.validateProfile(f);
      if (!v.ok) return { ok: false, errors: v.errors };
      const nick = String(f.nick).trim();
      const job = f.job ? R.canonicalJob(f.job) : '';
      const intro = String(f.intro || '').trim();
      const major = String(f.major || '').trim();
      const grade = f.grade || '';
      try {
        if (nick !== user.displayName) await authMod.updateProfile(user, { displayName: nick });
        await fs.setDoc(fs.doc(db, 'users', uid), Object.assign({ nick: nick, job: job, intro: intro, major: major, grade: grade }, R.profileExtras(f), { updatedAt: Date.now() }));
        lsSet(NICK_KEY, nick);
        if (job) lsSet(JOB_KEY, job);
        emit();
        return { ok: true };
      } catch (err) {
        console.error('[면스방] 프로필 저장 실패', err && err.code);
        return { ok: false, reason: failReason(err) };
      }
    },
    changePassword: async function (f) {
      if (!signedIn()) return needLogin();
      const errors = {};
      if (!f.current) errors.current = '지금 비밀번호를 적어 주세요.';
      const p = R.passwordIssue(f.next);
      if (p) errors.next = p;
      else if (f.next !== f.next2) errors.next2 = '새 비밀번호가 서로 달라요.';
      else if (f.next === f.current) errors.next = '지금 비밀번호와 다른 비밀번호를 적어 주세요.';
      if (Object.keys(errors).length) return { ok: false, errors: errors };
      try {
        await authMod.reauthenticateWithCredential(user, authMod.EmailAuthProvider.credential(user.email, f.current));
      } catch (err) {
        const code = err && err.code;
        if (code === 'auth/too-many-requests') return { ok: false, reason: '시도가 너무 많았어요. 잠시 뒤 다시 해 보세요.' };
        return { ok: false, errors: { current: '지금 비밀번호가 맞지 않아요.' } };
      }
      try {
        await authMod.updatePassword(user, f.next);
        return { ok: true };
      } catch (err) { return authFail(err); }
    },

    signUp: async function (f) {
      const v = R.validateSignup(f);
      if (!v.ok) return { ok: false, errors: v.errors };
      const email = R.idToEmail(f.username);
      const nick = String(f.nick).trim();
      const wasAnon = !!(user && user.isAnonymous);
      try {
        let cred;
        if (wasAnon) cred = await authMod.linkWithCredential(user, authMod.EmailAuthProvider.credential(email, f.password));
        else cred = await authMod.createUserWithEmailAndPassword(auth, email, f.password);
        await authMod.updateProfile(cred.user, { displayName: nick });
        await cred.user.getIdToken(true);
        setUser(auth.currentUser);
        lsSet(NICK_KEY, nick);
        emit();
        return { ok: true, linked: wasAnon };
      } catch (err) { return authFail(err); }
    },

    signIn: async function (f) {
      const id = R.normUsername(f.username);
      if (R.usernameIssue(id) || !f.password) return { ok: false, reason: '아이디 또는 비밀번호가 맞지 않아요.' };
      try {
        const cred = await authMod.signInWithEmailAndPassword(auth, R.idToEmail(id), f.password);
        setUser(cred.user);
        if (cred.user.displayName) lsSet(NICK_KEY, cred.user.displayName);
        emit();
        return { ok: true };
      } catch (err) { return authFail(err); }
    },

    signOut: async function () {
      closeRoom();
      if (prof.off) prof.off();
      prof = { uid: null, data: null, off: null };
      previewSubs.forEach(function (off) { off(); });
      previewSubs.clear();
      lastMsg.clear();
      recentMsgs.clear();
      try { await authMod.signOut(auth); } catch (e) { /* 무시 */ }
      lsSet(NICK_KEY, '');
      setUser(null);
      emit();
      return { ok: true };
    },
    users: function () { return []; },
    switchUser: function () { /* 실서비스에는 없음 */ },
    resetDemo: function () { /* 실서비스에는 없음 */ },

    posts: function () { return Array.from(cache.values()); },

    /* ---------- 채팅 ---------- */
    rooms: function () {
      return myRoomIds().map(function (id) { return { post: cache.get(id), last: lastMsg.has(id) ? lastMsg.get(id) : undefined }; });
    },
    openRoom: function (id) {
      if (room.id === id) return;
      closeRoom();
      if (!signedIn()) return;
      room.id = id;
      const q = fs.query(msgCol(id), fs.orderBy('at', 'asc'), fs.limitToLast(200));
      room.off = fs.onSnapshot(q, function (snap) {
        if (room.id !== id) return;
        room.list = snap.docs.map(msgFrom);
        room.error = null;
        emit();
      }, function (err) {
        console.error('[면스방] 채팅 오류', err && err.code);
        if (room.id !== id) return;
        room.error = err && err.code === 'permission-denied' ? '이 채팅방은 참가자만 볼 수 있어요.' : '채팅을 불러오지 못했어요. 새로고침해 보세요.';
        emit();
      });
    },
    closeRoom: closeRoom,
    roomState: function (id) {
      if (room.id !== id) return { loading: true, list: [] };
      return { loading: room.list === null && !room.error, list: room.list || [], error: room.error };
    },
    send: async function (id, text) {
      if (!signedIn()) return needLogin();
      const t = String(text || '').trim();
      if (!t) return { ok: false, reason: '메시지를 적어 주세요.' };
      if (t.length > 500) return { ok: false, reason: '메시지는 500자 안으로 적어 주세요.' };
      const p = cache.get(id);
      const m = p && R.memberOf(p, uid);
      if (!m) return { ok: false, reason: '참가자만 메시지를 보낼 수 있어요.' };
      try {
        await fs.addDoc(msgCol(id), { uid: uid, nick: m.nick, text: t, at: Date.now() });
        return { ok: true };
      } catch (err) {
        console.error('[면스방] 메시지 실패', err && err.code);
        return { ok: false, reason: failReason(err) };
      }
    },
    markRead: function (id) {
      const m = readMap();
      const last = lastMsg.get(id);
      m[id] = Math.max(m[id] || 0, last ? last.at : 0, Date.now());
      lsSet(readKey(), JSON.stringify(m));
    },
    /* 안 읽은 메시지 개수 (남이 보낸 것만, 최대 10) */
    unread: function (id) {
      const readAt = readMap()[id] || 0;
      return (recentMsgs.get(id) || []).filter(function (m) { return m.uid !== uid && m.at > readAt; }).length;
    },
    post: function (id) { return cache.get(id) || null; },

    /* 목록(최근 200개)에 없는 글을 링크로 열었을 때 따로 불러온다: 'found' | 'loading' | 'missing' */
    watch: function (id) {
      if (cache.has(id)) return 'found';
      const st = docState.get(id);
      if (st === 'loading' || st === 'missing') return st;
      docState.set(id, 'loading');
      fs.onSnapshot(ref(id), function (ds) {
        if (ds.exists()) { cache.set(id, fromDoc(ds)); docState.set(id, 'watch'); }
        else { cache.delete(id); docState.set(id, 'missing'); }
        emit();
      }, function () { docState.set(id, 'missing'); emit(); });
      return 'loading';
    },

    createPost: async function (f) {
      if (!signedIn()) return needLogin();
      f = Object.assign({}, f, { nick: user.displayName || f.nick });
      const now = Date.now();
      const v = R.validatePost(f, now);
      if (!v.ok) return { ok: false, errors: v.errors };
      const nick = String(f.nick).trim();
      const host = entry(nick, f.job, '', now, myProfile());
      host.role = 'host';
      const data = {
        company: String(f.company).trim(), job: host.job, jobKey: host.jobKey, stage: f.stage,
        interviewDate: f.interviewDate || null, recruitStart: f.recruitStart, recruitEnd: f.recruitEnd,
        mode: f.mode, place: f.mode === 'offline' ? String(f.place).trim() : '',
        capacity: Number(f.capacity), jobRule: f.jobRule, joinMode: f.joinMode, intro: String(f.intro || '').trim(),
        hostId: uid, closed: false, createdAt: now, members: {}, applicants: {}
      };
      data.members[uid] = host;
      let lastErr = null;
      for (let attempt = 0; attempt < 3; attempt++) {
        const id = R.newId(8);
        try {
          await fs.setDoc(ref(id), data);
          lsSet(NICK_KEY, nick);
          lsSet(JOB_KEY, host.job);
          const post = Object.assign({ id: id }, data, { members: [Object.assign({ uid: uid }, host)], applicants: [] });
          if (!cache.has(id)) cache.set(id, post);
          emit();
          return { ok: true, post: cache.get(id) };
        } catch (err) {
          lastErr = err;
          console.error('[면스방] 글 저장 실패', err);
          if (!err || err.code !== 'permission-denied') break;
        }
      }
      return { ok: false, reason: failReason(lastErr) };
    },

    apply: async function (id, f) {
      if (!signedIn()) return needLogin();
      f = Object.assign({}, f, { nick: user.displayName || f.nick });
      const p = cache.get(id);
      if (!p) return { ok: false, reason: '글을 찾을 수 없어요.' };
      const chk = R.checkApply(p, uid, f, Date.now());
      if (!chk.ok) return chk;
      const nick = String(f.nick).trim();
      const e = entry(R.uniqueNick(p, nick), f.job, f.intro, Date.now(), myProfile());
      const data = {};
      if (p.joinMode === 'instant') { e.role = 'member'; data['members.' + uid] = e; }
      else { e.status = 'pending'; data['applicants.' + uid] = e; }
      const r = await write(id, data);
      if (!r.ok) {
        const latest = cache.get(id);
        const again = latest ? R.checkApply(latest, uid, f, Date.now()) : { ok: false, reason: '글을 찾을 수 없어요.' };
        return again.ok ? r : again;
      }
      lsSet(NICK_KEY, nick);
      lsSet(JOB_KEY, e.job);
      return { ok: true, joined: p.joinMode === 'instant' };
    },

    cancel: function (id) {
      const data = {};
      data['applicants.' + uid] = fs.deleteField();
      return write(id, data);
    },

    leave: function (id) {
      const p = cache.get(id);
      if (p && p.hostId === uid) return Promise.resolve({ ok: false, reason: '방장은 나갈 수 없어요. 글을 지워 주세요.' });
      const data = {};
      data['members.' + uid] = fs.deleteField();
      return write(id, data);
    },

    decide: function (id, who, accept) {
      const err = asHost(id);
      if (err) return Promise.resolve({ ok: false, reason: err });
      const p = cache.get(id);
      const ap = p.applicants.find(function (a) { return a.uid === who && a.status === 'pending'; });
      if (!ap) return Promise.resolve({ ok: false, reason: '이미 처리된 신청이에요.' });
      const data = {};
      if (accept) {
        const chk = R.checkAccept(p, ap, Date.now());
        if (!chk.ok) return Promise.resolve(chk);
        const m = entry(ap.nick, ap.job, ap.intro, Date.now(), ap);
        m.role = 'member';
        data['applicants.' + who] = fs.deleteField();
        data['members.' + who] = m;
      } else {
        data['applicants.' + who + '.status'] = 'rejected';
      }
      return write(id, data);
    },

    kick: function (id, who) {
      const err = asHost(id);
      if (err) return Promise.resolve({ ok: false, reason: err });
      const p = cache.get(id);
