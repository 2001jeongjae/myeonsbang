      const ctl = field && $('input:not([type="hidden"]):not([hidden]), select, textarea', field);
      if (!ctl) return;
      if (msg) { ctl.setAttribute('aria-invalid', 'true'); ctl.setAttribute('aria-describedby', el.id); }
      else { ctl.removeAttribute('aria-invalid'); ctl.removeAttribute('aria-describedby'); }
    });
    const order = ['company', 'job', 'stage', 'interviewDate', 'jobRule', 'joinMode', 'capacity', 'recruitStart', 'recruitEnd', 'mode', 'place', 'intro', 'username', 'nick', 'password', 'password2', 'current', 'next', 'next2'];
    const first = order.find(function (k) { return errors[k]; });
    if (first) {
      const el = $('[data-err="' + first + '"]', form);
      const field = el && el.closest('.field');
      if (field) {
        field.scrollIntoView({ block: 'center' });
        const ctl = $('input:not([type="hidden"]):not([hidden]), select, textarea, button', field);
        if (ctl) ctl.focus({ preventScroll: true });
      }
    }
  }

  function submitNew(form) {
    const checked = function (name) { const el = $('input[name="' + name + '"]:checked', form); return el ? el.value : ''; };
    const unknown = $('#n-date-unknown').checked;
    const f = {
      company: $('#n-company').value, job: readJob('n-job'), stage: checked('stage'),
      interviewDate: unknown ? null : ($('#n-date').value || null),
      recruitStart: $('#n-rs').value, recruitEnd: $('#n-re').value,
      mode: checked('mode'), place: $('#n-place').value, capacity: Number($('#n-cap').value),
      jobRule: checked('jobRule'), joinMode: checked('joinMode'),
      intro: $('#n-intro').value, nick: S.me().nick
    };
    const errors = R.validatePost(f, Date.now()).errors;
    if (!unknown && !f.interviewDate) errors.interviewDate = '면접일을 고르거나 ‘아직 몰라요’를 눌러 주세요.';
    if (Object.keys(errors).length) { showErrors(form, errors); return; }
    const btn = $('button[type="submit"]', form);
    btn.disabled = true;
    btn.textContent = '올리는 중…';
    S.createPost(f).then(function (res) {
      btn.disabled = false;
      btn.textContent = '모집 글 올리기';
      if (!res.ok) {
        if (res.login) { ui.dirty = false; go('login?next=new'); toast(res.reason); return; }
        if (res.errors) showErrors(form, res.errors);
        if (res.reason) toast(res.reason);
        return;
      }
      ui.dirty = false;
      ui.openShareFor = res.post.id;
      go('post-' + res.post.id);
    });
  }

  /* ---------- 글 상세 ---------- */
  function ruleBox(p) {
    if (p.jobRule === 'same') {
      return '<div class="rulebox rule-same"><b>같은 직무끼리</b>' + esc(p.job) + ' 직무만 신청할 수 있어요.</div>';
    }
    if (p.jobRule === 'diverse') {
      return '<div class="rulebox rule-diverse"><b>다른 직무끼리</b>참가자 직무가 모두 달라야 해요. 지금 있는 직무('
        + esc(p.members.map(function (m) { return m.job; }).join(', ')) + ')로는 신청할 수 없어요.</div>';
    }
    return '<div class="rulebox rule-any"><b>직무 무관</b>직무와 상관없이 신청할 수 있어요.</div>';
  }

  function nameTag(m, extra, open) {
    const inner = '<span class="avatar" aria-hidden="true">' + esc(initial(m.nick)) + '</span>'
      + '<span class="p-main"><span class="p-name">' + esc(m.nick) + (m.role === 'host' ? ' <span class="tag-host">방장</span>' : '') + '</span>'
      + '<span class="p-job">' + [m.job, R.profileLine(m), m.intro].filter(Boolean).map(esc).join(' · ') + '</span></span>';
    /* 같은 스터디 사람은 눌러서 프로필을 본다 */
    return '<li class="person">' + (open ? '<button type="button" class="p-open" data-action="view-profile" data-uid="' + esc(m.uid) + '" aria-label="' + esc(m.nick) + ' 프로필 보기">' + inner + '<span class="p-more" aria-hidden="true">프로필 ›</span></button>' : inner)
      + (extra || '') + '</li>';
  }
  /* ---------- 같은 스터디 사람 프로필 ---------- */
  function personOf(p, who) {
    return p.members.find(function (m) { return m.uid === who; }) || p.applicants.find(function (a) { return a.uid === who; }) || null;
  }
  function profileBody(e, live) {
    const d = live || {};
    const rows = [['이 모집 직무', e.job], ['지원 직무', d.job && d.job !== e.job ? d.job : ''], ['학과', d.major || e.major], ['학년', d.grade || e.grade], ['한 줄 소개', d.intro || e.intro]].concat(extraRows(d));
    return '<dl class="prof-dl">' + rows.filter(function (r) { return r[1]; }).map(function (r) {
      return '<div><dt>' + r[0] + '</dt><dd>' + esc(r[1]) + '</dd></div>';
    }).join('') + '</dl>' + (d.major || d.grade || d.intro || e.major || e.grade || e.intro ? '' : '<p class="muted">학과·학년·소개는 아직 적지 않았어요.</p>');
  }
  function profileCardHtml(e, live, loading) {
    return '<div class="prof-card" data-prof="' + esc(e.uid) + '"><div class="prof-top"><span class="avatar" aria-hidden="true">' + esc(initial(e.nick)) + '</span>'
      + '<p class="prof-name">' + esc(e.nick) + (e.role === 'host' ? ' <span class="tag-host">방장</span>' : e.status === 'pending' ? ' <span class="chip wait">수락 대기</span>' : '') + '</p></div>'
      + (loading ? '<p class="muted">프로필을 불러오는 중이에요…</p>' : profileBody(e, live)) + '</div>';
  }
  function fillProfiles(list) {
    list.forEach(function (e) {
      S.profileOf(e.uid).then(function (live) {
        const box = document.querySelector('.prof-card[data-prof="' + (window.CSS && CSS.escape ? CSS.escape(e.uid) : e.uid) + '"]');
        if (box) box.outerHTML = profileCardHtml(e, live, false);
      });
    });
  }
  function canSeePeople(p) { const u = S.me(); return !!(p && u.signedIn && R.memberOf(p, u.uid)); }
  function openProfile(p, who) {
    const e = personOf(p, who);
    if (!e || !canSeePeople(p)) return;
    openSheet('<h2 id="sheet-title" class="sr">' + esc(e.nick) + ' 프로필</h2>' + profileCardHtml(e, null, true)
      + '<div class="sheet-actions"><button type="button" class="btn" data-action="close-sheet">닫기</button></div>', null);
    fillProfiles([e]);
  }
  function openRoomPeople(p) {
    if (!canSeePeople(p)) return;
    openSheet('<h2 id="sheet-title">참가자 ' + p.members.length + '명</h2><p class="sheet-sub">같은 스터디 사람만 볼 수 있어요.</p>'
      + '<div class="prof-list">' + p.members.map(function (m) { return profileCardHtml(m, null, true); }).join('') + '</div>'
      + '<div class="sheet-actions"><button type="button" class="btn" data-action="close-sheet">닫기</button></div>', null);
    fillProfiles(p.members);
  }

  function hostPanel(p, now) {
    const pending = p.applicants.filter(function (a) { return a.status === 'pending'; });
    let inbox;
    if (p.joinMode !== 'approve') {
      inbox = '<p class="muted">바로 참가 방식이라, 조건이 맞는 사람은 신청과 동시에 참가해요.</p>';
    } else if (!pending.length) {
      inbox = '<h3>수락 기다리는 신청 <span class="num">0</span></h3><p class="muted">아직 들어온 신청이 없어요. 공유 문구를 단톡방에 올려 보세요.</p>';
    } else {
      inbox = '<h3>수락 기다리는 신청 <span class="num">' + pending.length + '</span></h3><ul class="appls">'
        + pending.map(function (a) {
          const chk = R.checkAccept(p, a, now);
          return '<li class="appl"><div class="appl-who"><button type="button" class="tag-nick link" data-action="view-profile" data-uid="' + esc(a.uid) + '" aria-label="' + esc(a.nick) + ' 프로필 보기">' + esc(a.nick) + '</button><span class="tag-job">' + esc(a.job) + '</span>'
            + (R.profileLine(a) ? '<span class="tag-prof">' + esc(R.profileLine(a)) + '</span>' : '')
            + '<span class="appl-when">' + esc(ago(a.at, now)) + '</span></div>'
            + (a.intro ? '<p class="appl-intro">' + esc(a.intro) + '</p>' : '')
            + (chk.ok ? '' : '<p class="warn">' + esc(chk.reason) + '</p>')
            + '<div class="appl-act"><button type="button" class="btn btn-small" data-action="reject" data-uid="' + esc(a.uid) + '">거절</button>'
            + '<button type="button" class="btn btn-small btn-primary" data-action="accept" data-uid="' + esc(a.uid) + '"' + (chk.ok ? '' : ' disabled') + '>수락</button></div></li>';
        }).join('') + '</ul>';
    }
    return '<section class="d-sec host-panel"><h2>방장 관리</h2>' + inbox
      + '<div class="host-act"><button type="button" class="btn" data-action="toggle-close">' + (p.closed ? '모집 다시 열기' : '모집 마감하기') + '</button>'
      + '<button type="button" class="btn danger-outline" data-action="delete-post">글 지우기</button></div></section>';
  }

  function renderDetail() {
    const p = S.post(ui.postId);
    if (!p && S.watch && S.watch(ui.postId) === 'loading') {
      view.innerHTML = '<a class="back" href="#board">← 모집 글</a><p class="loading">글을 불러오는 중이에요…</p>';
      renderActionBar(null);
      return;
    }
    if (!p) {
      view.innerHTML = '<a class="back" href="#board">← 모집 글</a><div class="empty"><p class="empty-t">글을 찾을 수 없어요.</p>'
        + '<p>방장이 지웠거나 주소가 잘못됐어요.</p><a class="btn" href="#board">모집 글 보러 가기</a></div>';
      renderActionBar(null);
      return;
    }
    const now = Date.now();
    const u = S.me();
    const st = R.statusOf(p, now);
    const n = R.daysUntil(p.interviewDate, now);
    const isHost = p.hostId === u.uid;
    const host = hostOf(p);
    const urgent = n != null && n >= 0 && n <= 3 && st !== 'past';
    const empty = Math.max(0, p.capacity - p.members.length);
    const seats = empty ? '<li class="person empty-seat"><span class="avatar" aria-hidden="true">+</span><span class="p-main"><span class="p-name">빈자리 ' + empty + '개</span>'
      + '<span class="p-job">' + (st === 'open' ? '조건이 맞으면 신청할 수 있어요' : '지금은 신청을 받지 않아요') + '</span></span></li>' : '';

    view.innerHTML = '<a class="back" href="#board">← 모집 글</a>'
      + '<article class="detail st-' + st + '">'
      + '<header class="d-head"><div class="d-stub' + (urgent ? ' urgent' : '') + '"><span class="dd">' + esc(R.ddayLabel(n)) + '</span>'
      + '<span class="dd-date">' + (p.interviewDate ? esc(R.dateLabel(p.interviewDate)) + ' 면접' : '면접일 미정') + '</span></div>'
      + '<div class="d-titles"><p class="company">' + esc(p.company) + ' 면접 스터디</p><h1>' + esc(ticketTitle(p)) + '</h1>'
      + '<div class="chips"><span class="pill st-' + st + '">' + R.STATUS[st] + '</span><span class="chip rule-' + p.jobRule + '">' + R.RULES[p.jobRule].label + '</span>'
      + '<span class="chip">' + R.JOIN[p.joinMode].label + '</span>' + (p.seed ? '<span class="chip ex">예시</span>' : '') + '</div></div></header>'
      + '<dl class="facts">'
      + '<div><dt>전형</dt><dd>' + esc(p.stage) + '</dd></div>'
      + '<div><dt>진행</dt><dd>' + (p.mode === 'online' ? '온라인' : '오프라인 · ' + esc(p.place)) + '</dd></div>'
      + '<div><dt>인원</dt><dd>' + p.members.length + '/' + p.capacity + '명</dd></div>'
      + '<div><dt>모집 기간</dt><dd>' + recruitRange(p) + '</dd></div>'
      + '<div><dt>방장</dt><dd>' + esc(host ? host.nick + ' · ' + host.job : p.job) + '</dd></div>'
      + '<div><dt>올린 때</dt><dd>' + esc(ago(p.createdAt, now)) + '</dd></div>'
      + '</dl>'
      + ruleBox(p)
      + (p.intro ? '<section class="d-sec"><h2>방장 한마디</h2><p class="intro">' + esc(p.intro) + '</p></section>' : '')
      + '<section class="d-sec"><h2>참가자 <span class="num">' + p.members.length + '/' + p.capacity + '</span></h2><ul class="people">'
      + p.members.map(function (m) {
        return nameTag(m, isHost && m.role !== 'host' ? '<button type="button" class="link danger" data-action="kick" data-uid="' + esc(m.uid) + '">내보내기</button>' : '', canSeePeople(p));
      }).join('') + seats + '</ul></section>'
      + (isHost ? hostPanel(p, now) : '')
      + '</article>';
    renderActionBar(p);
    if (ui.openShareFor === p.id) { ui.openShareFor = null; openShare(p, true); }
  }

  function renderActionBar(p) {
    const bar = $('#actionbar');
    if (!p || ui.route !== 'post') {
      bar.hidden = true; bar.innerHTML = ''; document.body.classList.remove('has-bar');
      return;
    }
    const u = S.me();
    const st = R.statusOf(p, Date.now());
    const mine = R.memberOf(p, u.uid);
    const ap = R.applicationOf(p, u.uid);
    const share = '<button type="button" class="btn" data-action="share">공유 문구</button>';
    let left, right;
    const chatBtn = '<a class="btn btn-primary" href="#chat-' + esc(p.id) + '">채팅방</a>';
    if (p.hostId === u.uid) {
      left = share; right = chatBtn;
    } else if (mine) {
      left = '<span class="bar-note ok">참가 중</span>'; right = '<button type="button" class="btn" data-action="leave">나가기</button>' + chatBtn;
    } else if (ap && ap.status === 'pending') {
      left = '<span class="bar-note wait">방장 수락을 기다리는 중</span>'; right = '<button type="button" class="btn" data-action="cancel">신청 취소</button>';
    } else if (ap && ap.status === 'rejected') {
      left = '<span class="bar-note">이번 모집에는 함께하지 못하게 됐어요</span>'; right = '<a class="btn" href="#board">다른 글 보기</a>';
    } else if (st !== 'open') {
      left = share; right = '<button type="button" class="btn btn-primary" disabled>' + R.STATUS[st] + '</button>';
    } else if (!u.signedIn) {
      left = share; right = '<a class="btn btn-primary" href="#login?next=post-' + esc(p.id) + '">로그인하고 ' + (p.joinMode === 'instant' ? '참가하기' : '신청하기') + '</a>';
    } else {
      left = share; right = '<button type="button" class="btn btn-primary" data-action="open-apply">' + (p.joinMode === 'instant' ? '참가하기' : '신청하기') + '</button>';
    }
    bar.innerHTML = '<div class="bar-in"><div class="bar-left">' + left + '</div><div class="bar-right">' + right + '</div></div>';
    bar.hidden = false;
    document.body.classList.add('has-bar');
  }

  /* ---------- 아래에서 올라오는 창 ---------- */
  let lastFocus = null;
  function openSheet(html, focusId) {
    const root = $('#sheet-root');
    lastFocus = document.activeElement;
    root.innerHTML = '<div class="scrim" data-action="close-sheet" aria-hidden="true"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">' + html + '</div>';
    root.hidden = false;
    document.body.classList.add('sheet-open');
    const fine = window.matchMedia && window.matchMedia('(pointer: fine)').matches;
    const target = (focusId && fine) ? $('#' + focusId) : (focusId ? $('.sheet', root) : $('.sheet button', root));
    if (target) setTimeout(function () { target.focus(); }, 30);
  }
  function closeSheet() {
    const root = $('#sheet-root');
    if (root.hidden) return;
    root.hidden = true;
    root.innerHTML = '';
    document.body.classList.remove('sheet-open');
    if (ui.confirm) { const r = ui.confirm; ui.confirm = null; r(false); }
    if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus();
  }
  function confirmSheet(o) {
    return new Promise(function (resolve) {
      openSheet('<h2 id="sheet-title">' + esc(o.title) + '</h2><p class="sheet-sub">' + esc(o.body) + '</p>'
        + '<div class="sheet-actions"><button type="button" class="btn" data-action="confirm-no">취소</button>'
        + '<button type="button" class="btn ' + (o.danger ? 'btn-danger' : 'btn-primary') + '" data-action="confirm-yes">' + esc(o.ok) + '</button></div>', null);
      ui.confirm = resolve;
    });
  }

  function openApply(p) {
    const u = S.me();
    const verb = p.joinMode === 'instant' ? '참가하기' : '신청 보내기';
    openSheet('<h2 id="sheet-title">' + (p.joinMode === 'instant' ? '바로 참가하기' : '참가 신청하기') + '</h2>'
      + '<p class="sheet-sub">' + esc(R.postTitle(p)) + ' · ' + R.RULES[p.jobRule].label + '</p>'
      + '<form id="apply-form" class="form tight" novalidate>'
      + '<p class="as-who">' + esc(u.nick) + ' 닉네임으로 신청해요.' + (R.profileLine(u) ? ' 프로필의 ' + esc(R.profileLine(u)) + '도 함께 보여요.' : '') + '</p>'
      + '<div class="field"><label for="a-job">내 직무</label>' + jobSelect('a-job', u.job) + '</div>'
      + '<div class="field"><label for="a-intro">한 줄 소개 <span class="opt">(선택)</span></label><input id="a-intro" name="intro" maxlength="60" placeholder="예: 생산라인 실습 경험 있어요…" autocomplete="off" value="' + esc(u.intro || '') + '"></div>'
      + '<p class="check-line" id="a-check" aria-live="polite"></p>'
      + '<p class="hint">실명·연락처·학교명은 적지 마세요.</p>'
      + '<div class="sheet-actions"><button type="button" class="btn" data-action="close-sheet">닫기</button>'
      + '<button type="submit" class="btn btn-primary" id="a-submit">' + verb + '</button></div>'
      + '</form>', 'a-job');
    updateApplyCheck(p);
  }
  function applyForm() {
    return { nick: S.me().nick, job: readJob('a-job'), intro: $('#a-intro').value };
  }
  function updateApplyCheck(p) {
    const el = $('#a-check');
    if (!el) return;
    const f = applyForm();
    let chk;
    if (!f.job) { el.className = 'check-line'; el.textContent = '내 직무를 고르면 신청할 수 있는지 바로 알려 드려요.'; return; }
    chk = R.ruleCheck(p, f.job);
    if (chk.ok) chk = R.checkApply(p, S.me().uid, f, Date.now());
    if (chk.ok) {
      el.className = 'check-line ok';
      el.textContent = p.joinMode === 'instant' ? '조건이 맞아요. 누르면 바로 참가돼요.' : '조건이 맞아요. 방장이 수락하면 참가돼요.';
    } else {
      el.className = 'check-line bad';
      el.textContent = chk.reason;
    }
  }
  function submitApply() {
    const p = S.post(ui.postId);
    if (!p) return;
    const btn = $('#a-submit');
    btn.disabled = true;
    S.apply(p.id, applyForm()).then(function (r) {
      btn.disabled = false;
      if (r.login) { closeSheet(); go('login?next=post-' + p.id); toast(r.reason); return; }
      if (!r.ok) {
        const el = $('#a-check');
        el.className = 'check-line bad';
        el.textContent = r.reason;
        return;
      }
      closeSheet();
      toast(r.joined ? '참가했어요. 참가자 목록에 이름이 올라갔어요.' : '신청을 보냈어요. 방장이 수락하면 참가돼요.');
    });
  }

  function shareUrl(p) {
    if (S.kind === 'demo') return 'https://(사이트 주소)/#post-' + p.id;
    return location.origin + location.pathname + '#post-' + p.id;
  }
  function openShare(p, justCreated) {
    const text = R.shareText(p, shareUrl(p), Date.now());
    openSheet('<h2 id="sheet-title">' + (justCreated ? '모집 글을 올렸어요' : '공유 문구') + '</h2>'
      + '<p class="sheet-sub">아래 문구를 취업 단톡방에 붙여 넣으세요. 링크를 누르면 이 글로 바로 들어와요.</p>'
      + '<label class="sr" for="share-text">공유 문구</label><textarea id="share-text" class="share-text" rows="5" readonly>' + esc(text) + '</textarea>'
      + (S.kind === 'demo' ? '<p class="hint">체험 모드라 링크는 아직 열리지 않아요. 실제 주소에 올리면 이 링크로 바로 들어와요.</p>' : '')
      + '<div class="sheet-actions"><button type="button" class="btn" data-action="close-sheet">닫기</button>'
      + '<button type="button" class="btn btn-primary" data-action="copy-share">문구 복사</button></div>', null);
  }
  function copyText(ta) {
    if (!ta) return;
    const done = function () { toast('복사했어요. 단톡방에 붙여 넣으세요.'); };
    const fallback = function () {
      try {
        ta.focus(); ta.select();
        if (document.execCommand && document.execCommand('copy')) { done(); return; }
      } catch (e) { /* 아래 안내로 */ }
      ta.focus(); ta.select();

  /* ---------- 채용 일정 ---------- */
  const JOBS = (window.JOBS && window.JOBS.items) || [];
  /* 공공기관 공고는 /api/jobs (잡알리오 API, 서버에서 6시간마다 새로 받음)에서 더 받아 붙인다. 실서비스에서만 */
  const live = { state: window.MYEONSBANG_FIREBASE ? 'loading' : 'off', at: '', count: 0 };
  function okDate(v) { return typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v); }
  function strList(v, max) { return Array.isArray(v) ? v.filter(function (x) { return typeof x === 'string'; }).slice(0, max || 12) : []; }
  function cleanLiveJob(j) {
    if (!j || typeof j !== 'object' || typeof j.id !== 'string' || !/^alio-\d{1,12}$/.test(j.id)) return null;
    if (typeof j.company !== 'string' || typeof j.title !== 'string' || !j.apply || !okDate(j.apply.end)) return null;
    const url = 'https://job.alio.go.kr/recruitview.do?idx=' + j.id.slice(5);
    return {
      id: j.id, auto: true, company: j.company.slice(0, 60), title: j.title.slice(0, 120),
      jobs: strList(j.jobs, 8).length ? strList(j.jobs, 8) : ['직무 공고문 확인'],
      duties: strList(j.duties).filter(function (s) { return T.SUB_TO_DUTY[s]; }),
      types: strList(j.types).filter(function (s) { return T.TYPES.indexOf(s) >= 0; }),
      corp: '공공기관/공기업',
      regions: strList(j.regions, 16).filter(function (s) { return T.REGIONS.indexOf(s) >= 0; }),
      industries: strList(j.industries).filter(function (s) { return T.INDUSTRIES.indexOf(s) >= 0; }),
      apply: okDate(j.apply.start) ? { start: j.apply.start, end: j.apply.end } : { end: j.apply.end },
      steps: [], flow: typeof j.flow === 'string' ? j.flow.slice(0, 80) : '', note: typeof j.note === 'string' ? j.note.slice(0, 80) : '',
      url: url, source: { name: '잡알리오 (자동)', url: url }
    };
  }
  function loadLiveJobs() {
    if (live.state === 'off') return;
    fetch('/api/jobs', { headers: { Accept: 'application/json' } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || !Array.isArray(d.items) || !d.items.length) { live.state = 'none'; return; }
        /* 사람이 정리한 공고와 같은 기관·같은 마감이면 사람이 정리한 쪽만 둔다 */
        const mine = {};
        JOBS.forEach(function (j) { if (j.apply && j.apply.end) mine[R.squash(j.company) + '|' + j.apply.end] = true; });
        let n = 0;
        d.items.forEach(function (raw) {
          const j = cleanLiveJob(raw);
          if (j && !mine[R.squash(j.company) + '|' + j.apply.end] && !JOBS.some(function (x) { return x.id === j.id; })) { JOBS.push(j); n++; }
        });
        live.state = 'ok'; live.count = n; live.at = typeof d.updatedAt === 'string' ? d.updatedAt : '';
        if (ui.route === 'jobs' && $('#jobs-list')) {
          const panel = $('#jf-panel'); if (panel) panel.innerHTML = jobFilterPanel(ui.jobFilter);
          const chk = $('.jobs-check'); if (chk) chk.innerHTML = jobsCheckHtml();
          renderJobList();
        }
      })
      .catch(function () { live.state = 'none'; });
  }
  function jobsCheckHtml() {
    const checked = window.JOBS && window.JOBS.checkedAt;
    let s = checked ? esc(R.dateLabel(checked)) + '에 공고문으로 확인한 일정이에요. ' : '';
    if (live.state === 'ok') {
      const t = live.at ? new Date(live.at) : null;
      const when = t && !isNaN(t) ? R.dateLabel(R.todayKST(t.getTime())) + ' ' + String((t.getUTCHours() + 9) % 24).padStart(2, '0') + ':' + String(t.getUTCMinutes()).padStart(2, '0') : '';
      s += '공공기관 공고 ' + live.count + '개는 잡알리오에서 자동으로 받아요' + (when ? ' (' + esc(when) + ' 갱신)' : '') + '. ';
    } else if (live.state === 'loading') s += '공공기관 공고를 불러오는 중이에요. ';
    return s + '일정은 회사 사정으로 바뀔 수 있으니 지원 전에 원문을 꼭 확인하세요.';
  }
  function rangeLabel(a, b) { return b && b !== a ? R.dateLabel(a) + '~' + R.dateLabel(b) : R.dateLabel(a); }
  function stepWhen(st) { return st.when || rangeLabel(st.start, st.end); }
  function stepSort(st) { return st.sort || st.start; }
  function stepEnd(st) { return st.end || st.start || st.sort; }
  function shortLabel(label) { return String(label).replace(/\s*\(.*\)\s*$/, ''); }
  function jobState(j, today) {
    const a = j.apply || {};
    if (a.start && a.start > today) return 'soon';
    if (a.rolling) return 'open';
    if (a.end && a.end >= today) return 'open';
    return 'process';
  }
  function nextStep(j, today) {
    return (j.steps || []).filter(function (st) { return stepEnd(st) >= today; })
      .sort(function (x, y) { return stepSort(x) < stepSort(y) ? -1 : 1; })[0] || null;
  }
  function jobSortKey(j, today) {
    const state = jobState(j, today);
    if (state === 'open' && j.apply.rolling) return '9999-12-30';
    if (state !== 'process') return (state === 'open' ? j.apply.end : j.apply.start);
    const n = nextStep(j, today);
    return n ? stepSort(n) : '9999-12-31';
  }
  function openStudies(company) {
    const key = R.squash(company);
    const now = Date.now();
    return S.posts().filter(function (p) { return R.squash(p.company) === key && R.statusOf(p, now) === 'open'; }).length;
  }
  const JOB_STATE = { open: '접수 중', soon: '접수 예정', process: '전형 진행 중' };
  function jobCard(j, today, now, f) {
    const state = jobState(j, today);
    const a = j.apply || {};
    const n = nextStep(j, today);
    const count = openStudies(j.company);
    let applyText = a.rolling ? R.dateLabel(a.start) + '~ 채용 시 마감' : a.start ? rangeLabel(a.start, a.end) : '~' + R.dateLabel(a.end);
    if (a.endTime) applyText += ' ' + a.endTime;
    const left = a.rolling ? '' : state === 'open' ? ' <span class="dleft">' + esc(R.ddayLabel(R.daysUntil(a.end, now))) + '</span>' : (state === 'process' ? ' <span class="dleft done">마감</span>' : '');
    let next = '';
    if (n) next = '<div class="next"><dt>다음 일정</dt><dd>' + esc(n.label) + ' · ' + esc(stepWhen(n)) + '</dd></div>';
    else if (state === 'process') next = '<div class="next"><dt>다음 일정</dt><dd>' + (j.flow ? esc(j.flow) + ' (일정은 개별 안내)' : '공고문에 아직 안 나왔어요. 개별 안내를 기다려 주세요.') + '</dd></div>';
    return '<li class="job" id="job-' + esc(j.id) + '">'
      + '<div class="job-top"><span class="company">' + esc(j.company) + '</span><span class="pill js-' + state + '">' + JOB_STATE[state] + '</span></div>'
      + '<h2 class="job-title">' + esc(j.title) + '</h2>'
      + '<p class="job-tags">' + j.jobs.map(esc).join(' · ') + '</p>'
      + '<p class="job-cats">' + (j.duties || []).map(function (c) {
        return '<span class="cat-tag' + (f && f.sub === c ? ' on' : '') + '">' + esc(c) + '</span>';
      }).join('') + '</p>'
      + '<p class="job-meta">' + [(j.types || []).join('·'), j.corp, (j.regions || []).join('·'), (j.industries || []).join('·')].filter(Boolean).map(esc).join(' · ') + '</p>'
      + '<dl class="job-dates"><div><dt>서류 접수</dt><dd>' + esc(applyText) + left + '</dd></div>' + next + '</dl>'
      + (j.note ? '<p class="job-note">' + esc(j.note) + '</p>' : '')
      + '<div class="job-act"><a class="btn btn-primary btn-small" href="#new?company=' + encodeURIComponent(j.company) + '">이 공고로 면스 모집</a>'
      + (count ? '<a class="btn btn-small" href="#board?q=' + encodeURIComponent(j.company) + '">모집 중인 면스 ' + count + '개</a>' : '')
      + '<a class="link ext" href="' + esc(j.url) + '" target="_blank" rel="noopener noreferrer">원문 보기<span class="sr"> (새 창)</span></a></div>'
      + '<p class="job-src">' + (j.auto ? '자동 수집: ' : '일정 확인: ') + '<a href="' + esc(j.source.url) + '" target="_blank" rel="noopener noreferrer">' + esc(j.source.name) + '</a></p>'
      + '</li>';
  }
  /* ---------- 채용 일정 필터: 직무(대분류→상세)·채용형태·기업·지역·산업·검색 ---------- */
  const T = window.TAXO;
  const FKEYS = ['duty', 'sub', 'type', 'corp', 'region', 'ind', 'q', 'view'];
  const FTABS = [
    { key: 'duty', label: '직무' }, { key: 'type', label: '채용형태', list: T.TYPES }, { key: 'corp', label: '기업', list: T.CORPS },
    { key: 'region', label: '지역', list: T.REGIONS }, { key: 'ind', label: '산업', list: T.INDUSTRIES }
  ];
  function emptyFilter() { return { duty: '', sub: '', type: '', corp: '', region: '', ind: '', q: '', view: '' }; }
  function jobDuties(j) {
    const out = [];
    (j.duties || []).forEach(function (s) { const d = T.SUB_TO_DUTY[s]; if (d && out.indexOf(d) < 0) out.push(d); });
    return out;
  }
  function jobMatches(j, f) {
    if (f.sub && (j.duties || []).indexOf(f.sub) < 0) return false;
    if (f.duty && !f.sub) {
      if (f.duty === '기타') { if (jobDuties(j).length) return false; }
      else if (jobDuties(j).indexOf(f.duty) < 0) return false;
    }
    if (f.type && (j.types || []).indexOf(f.type) < 0) return false;
    if (f.corp && j.corp !== f.corp) return false;
    if (f.region) {
      const rs = j.regions || [];
      if (rs.indexOf(f.region) < 0 && !(f.region !== '지역 제한없음' && rs.indexOf('지역 제한없음') >= 0)) return false;
    }
    if (f.ind && (j.industries || []).indexOf(f.ind) < 0) return false;
    const words = String(f.q || '').trim().toLowerCase().split(/\s+/).filter(Boolean);
    if (words.length) {
      const hay = [j.company, j.title, j.note || ''].concat(j.jobs, j.duties || [], jobDuties(j), j.industries || []).join(' ').toLowerCase();
      if (!words.every(function (w) { return hay.indexOf(w) >= 0; })) return false;
    }
    return true;
  }
  function countWith(f, patch) { const g = Object.assign({}, f, patch); return JOBS.filter(function (j) { return jobMatches(j, g); }).length; }
  function jobsHash(f) {
    const q = new URLSearchParams();
    FKEYS.forEach(function (k) { if (f[k]) q.set(k, f[k]); });
    const qs = q.toString();
    return '#jobs' + (qs ? '?' + qs : '');
  }
  function fchip(label, n, on, href, cls) {
    return '<a class="jchip' + (cls ? ' ' + cls : '') + (on ? ' on' : '') + (!n && !on ? ' zero' : '') + '" href="' + href + '"' + (on ? ' aria-current="true"' : '') + '>'
      + esc(label) + ' <span class="num">' + n + '</span></a>';
  }
  function jobFilterPanel(f) {
    const tab = ui.jobTab || 'duty';
    if (tab === 'duty') {
      let html = '<p class="jf-label">직무 대분류</p><div class="jf-chips">' + T.DUTIES.map(function (d) {
        const on = f.duty === d.name;
        const next = Object.assign({}, f, { duty: on ? '' : d.name, sub: '' });
        return fchip(d.name, countWith(f, { duty: d.name, sub: '' }), on, jobsHash(next));
      }).join('') + '</div>';
      const d = T.DUTIES.find(function (x) { return x.name === f.duty; });
      if (d) {
        html += '<div class="jf-sub"><p class="jf-label">' + esc(d.name) + ' 상세</p><div class="jf-chips">'
          + fchip('전체', countWith(f, { sub: '' }), !f.sub, jobsHash(Object.assign({}, f, { sub: '' })))
          + d.subs.map(function (s2) {
            const on = f.sub === s2;
            return fchip(s2, countWith(f, { sub: s2 }), on, jobsHash(Object.assign({}, f, { sub: on ? '' : s2 })));
          }).join('') + '</div></div>';
      }
      return html;
    }
    const t = FTABS.find(function (x) { return x.key === tab; });
    return '<div class="jf-chips">' + t.list.map(function (v) {
      const on = f[tab] === v;
      const patch = {}; patch[tab] = v;
      const next = Object.assign({}, f); next[tab] = on ? '' : v;
      return fchip(v, countWith(f, patch), on, jobsHash(next));
    }).join('') + '</div>';
  }
  function jobFilterActive(f) {
    const picked = [];

        const m = R.memberOf(p, t.dataset.uid);
        if (!m) break;
        confirmSheet({ title: m.nick + '님을 내보낼까요?', body: '내보낸 사람은 이 모집에 다시 신청할 수 없어요.', ok: '내보내기', danger: true })
          .then(function (yes) { if (yes) S.kick(p.id, m.uid).then(function (r) { toast(r.ok ? '내보냈어요.' : r.reason); }); });
        break;
      }
      case 'toggle-close': {
        if (!p) break;
        const closing = !p.closed;
        S.setClosed(p.id, closing).then(function (r) {
          toast(r.ok ? (closing ? '모집을 마감했어요. 더는 신청을 받지 않아요.' : '모집을 다시 열었어요.') : r.reason);
        });
        break;
      }
      case 'delete-post':
        if (!p) break;
        confirmSheet({ title: '모집 글을 지울까요?', body: '참가자와 신청 기록도 함께 사라지고, 되돌릴 수 없어요.', ok: '지우기', danger: true })
          .then(function (yes) { if (yes) S.remove(p.id).then(function (r) { if (r.ok) { toast('모집 글을 지웠어요.'); go('board'); } else toast(r.reason); }); });
        break;
      default: break;
    }
  });

  document.addEventListener('change', function (e) {
    const t = e.target;
    if (t.id === 'demo-user') {
      S.switchUser(t.value);
      toast('지금 사용자: ' + userLabel(S.me()));
      return;
    }
    if (t.matches('[data-job-select]')) {
      const c = $('#' + t.id + '-custom');
      if (c) { c.hidden = t.value !== '__custom'; if (!c.hidden) c.focus(); }
    }
    if (t.name === 'mode' && t.closest('#new-form')) $('#place-field').hidden = t.value !== 'offline';
    /* 관련 경험 '없음'은 다른 경험과 같이 고르지 않는다 */
    if (t.name === 'tags' && t.checked) {
      $$('input[name="tags"]', t.form).forEach(function (x) { if (x !== t && (t.value === '없음' || x.value === '없음')) x.checked = false; });
    }
    if (t.id === 'n-date' && t.value && $('#n-re')) { $('#n-re').max = t.value; if ($('#n-re').value > t.value) $('#n-re').value = t.value; }
    if (t.id === 'n-rs' && $('#n-re')) { $('#n-re').min = t.value; if ($('#n-re').value < t.value) $('#n-re').value = t.value; }
    if (t.id === 'n-date-unknown') { $('#n-date').disabled = t.checked; if (t.checked) $('#n-date').value = ''; }
    if (t.closest('#apply-form')) { const p = S.post(ui.postId); if (p) updateApplyCheck(p); }
    if (t.id === 'u-show') $$('#auth-form input[name^="password"]').forEach(function (i) { i.type = t.checked ? 'text' : 'password'; });
  });

  document.addEventListener('input', function (e) {
    const t = e.target;
    if (t.id === 'j-q') {
      ui.jobFilter.q = t.value.slice(0, 40);
      history.replaceState(null, '', jobsHash(ui.jobFilter));
      $('#jf-panel').innerHTML = jobFilterPanel(ui.jobFilter);
      renderJobList();
    }
    if (t.id === 'f-q') { ui.filters.q = t.value; saveFilters(); renderList(); syncBoardUrl(); }
    if (t.id === 'n-intro') $('#n-intro-count').textContent = t.value.length + '/300';
    if (t.id === 'p-intro') $('#p-intro-count').textContent = t.value.length + '/60';
    if (t.closest && (t.closest('#profile-form') || t.closest('#pw-form'))) {
      const fd = t.closest('.field'); const er = fd && $('[data-err]', fd);
      if (er && er.textContent) { er.textContent = ''; t.removeAttribute('aria-invalid'); t.removeAttribute('aria-describedby'); }
    }
    if (t.id === 'c-text') { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 140) + 'px'; }
    if (t.closest && t.closest('#new-form')) ui.dirty = true;
    if (t.closest && t.closest('#apply-form')) { const p = S.post(ui.postId); if (p) updateApplyCheck(p); }
    if (t.closest && t.closest('#auth-form')) {
      if (t.id === 'u-username' && t.value !== t.value.toLowerCase()) t.value = t.value.toLowerCase();
      const f = t.closest('.field');
      const err = f && $('[data-err]', f);
      if (err && err.textContent) { err.textContent = ''; t.removeAttribute('aria-invalid'); t.removeAttribute('aria-describedby'); }
      const m = $('#auth-msg'); if (m) m.textContent = '';
    }
  });

  document.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.id === 'new-form') submitNew(e.target);
    else if (e.target.id === 'apply-form') submitApply();
    else if (e.target.id === 'auth-form') submitAuth(e.target);
    else if (e.target.id === 'chat-form') sendChat();
    else if (e.target.id === 'profile-form') submitProfile(e.target);
    else if (e.target.id === 'pw-form') submitPassword(e.target);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeSheet();
    /* 채팅: 컴퓨터에서는 Enter로 보내고 Shift+Enter로 줄바꿈. 한글 입력 중(조합 중)에는 보내지 않는다 */
    if (e.target && e.target.id === 'c-text' && e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
      const fine = window.matchMedia && window.matchMedia('(pointer: fine)').matches;
      if (fine) { e.preventDefault(); sendChat(); }
    }
  });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && ui.route === 'room') updateRoom(false); });
  document.addEventListener('toggle', function (e) {
    if (e.target && e.target.matches && e.target.matches('details.done')) ui.doneOpen = e.target.open;
  }, true);
  /* 쓰던 모집 글이 있으면 창을 닫기 전에 한 번 묻는다 */
  window.addEventListener('beforeunload', function (e) {
    if (ui.route === 'new' && ui.dirty) { e.preventDefault(); e.returnValue = ''; }
  });

  let lastAuth = null;
  S.subscribe(function () {
    renderDemoBar();
    renderAuthLink();
    /* 로그인 상태가 바뀌면 (다른 탭에서 로그아웃 등) 지금 화면을 다시 그린다 */
    const now = S.me().uid + ':' + S.me().signedIn;
    if (lastAuth !== null && now !== lastAuth && ui.route !== 'login' && ui.route !== 'signup') { lastAuth = now; route(); return; }
    lastAuth = now;
    renderChatDot();
    if (ui.route === 'chat') renderChatList();
    else if (ui.route === 'room') renderRoom();
    if (ui.route === 'board') renderList();
    else if (ui.route === 'post') renderDetail();
    else if (ui.route === 'me') renderMe();
    else if (ui.route === 'jobs') renderJobs();
  });

  S.init().then(function () {
    lastAuth = S.me().uid + ':' + S.me().signedIn;
    window.addEventListener('hashchange', route);
    route();
    loadLiveJobs();
    /* 첫 화면 머리글은 처음 열 때 한 번만 올라오게 (taste: hero enters once) */
    setTimeout(function () { document.body.classList.add('entered'); }, 900);
  }, function (err) {
    console.error('[면스방] 시작 실패', err);
    view.innerHTML = '<div class="empty"><p class="empty-t">서버에 연결하지 못했어요.</p>'
      + '<p>인터넷 연결을 확인한 뒤 새로고침해 주세요.</p>'
      + '<button type="button" class="btn btn-primary" data-action="reload">새로고침</button></div>';
  });
})();

</script>
</body>
</html>
